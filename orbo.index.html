<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Orbo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Orbo — Sampa Games. Tek dokunuşla çarka top fırlatma. Tam ekran tuval (mantıksal genişlik 400) + DOM katmanları. */
:root{
  --ink:#fff8ef; --mute:#bdb3dc; --card:#1c1533; --card2:#261d45; --line:#3b3166;
  --acc:#ff6b5b; --sun:#ffc94a; --mint:#3ee0a7; --sky:#59c3ff;
  --disp:'Fredoka','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#140f24;color:var(--ink);font-family:var(--disp);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* menü */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none}
#menu .mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:auto}
#menu .grow{flex:1;min-height:150px}
.panel{pointer-events:auto;background:linear-gradient(180deg,rgba(28,21,51,.94),#150f28);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.pwrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.logo{margin:0;text-align:center;font-weight:700;font-size:clamp(52px,16vw,72px);line-height:.9;letter-spacing:-.02em}
.logo span{display:inline-block}
.logo .o{color:var(--sun)}
.tag{margin:-2px 0 2px;text-align:center;color:var(--mute);font-weight:500;font-size:15px}
.play{border:0;border-radius:22px;padding:15px 18px 13px;font-weight:700;font-size:30px;letter-spacing:.03em;color:#2a0d08;background:linear-gradient(180deg,#ff9a85,var(--acc));box-shadow:0 6px 0 #b8392c,0 14px 30px rgba(255,107,91,.3);line-height:1}
.play small{display:block;font-weight:600;font-size:13px;letter-spacing:.08em;margin-top:5px;opacity:.75}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #b8392c}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:11px 12px;min-width:0}
.mode i{grid-row:1/3;font-style:normal;font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07)}
.mode b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode small{font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode.hot{border-color:#7a5a1a;background:linear-gradient(180deg,#3a2c14,#2a2010)}
.mode.hot small{color:var(--sun)}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:11px 12px;font-weight:600;font-size:15px}
.btn.sun{background:linear-gradient(180deg,#ffe08a,var(--sun));color:#3a2600;border-color:#ffe7a6;box-shadow:0 4px 0 #a37800}
.btn.sun:active{transform:translateY(3px);box-shadow:0 1px 0 #a37800}
.btn.mint{background:linear-gradient(180deg,#8ff5cf,var(--mint));color:#06301f;border-color:#b6ffe3;box-shadow:0 4px 0 #1f8f63}
.btn:disabled{opacity:.4;cursor:default}
.ico{width:42px;height:42px;padding:0;border-radius:13px;font-size:17px;display:grid;place-items:center;background:rgba(20,15,36,.55);border:1px solid rgba(255,255,255,.18)}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(20,15,36,.6);border:1px solid rgba(255,255,255,.16);font-weight:600;font-variant-numeric:tabular-nums}
.adtag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.2);margin-right:5px;vertical-align:1px}

/* oyun içi */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#hudLbl{flex:1;text-align:center;font-weight:600;font-size:15px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:rgba(20,15,36,.82);border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:15px;text-align:center;pointer-events:none;animation:tipIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes tipIn{from{transform:translate(-50%,16px);opacity:0}}
#failCard{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.fc{pointer-events:auto;width:100%;max-width:400px;background:rgba(24,17,44,.95);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:fcUp .3s cubic-bezier(.2,1.2,.4,1);box-shadow:0 20px 50px rgba(0,0,0,.4)}
@keyframes fcUp{from{transform:translateY(40px);opacity:0}}
.fc h2{margin:0;font-size:30px;line-height:1;font-weight:700}
.fc p{margin:0;color:var(--mute);font-size:14px;font-weight:500}
.fc .big{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.fc .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:5px}

/* pencereler */
.modal{position:fixed;inset:0;background:rgba(10,7,20,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:380px;max-height:calc(100% - 20px);overflow-y:auto;background:linear-gradient(180deg,#2a2050,#1a1432);border:1px solid #4a3d80;border-radius:26px;padding:22px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.mt{font-size:32px;font-weight:700;line-height:1;margin:0}
.ms{color:var(--mute);font-weight:500;margin:-4px 0 0;font-size:14px;line-height:1.4}
.big-ic{font-size:52px;line-height:1}
.worlds{display:flex;flex-direction:column;gap:8px;text-align:left}
.wd{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:16px;padding:9px 10px}
.wd .sw{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px}
.wd b{font-size:16px;font-weight:600}
.wd small{display:block;color:var(--mute);font-size:12px}
.wd .bar{margin-top:5px}
.wd.lock{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv{aspect-ratio:1;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-weight:600;font-size:17px;padding:0;position:relative}
.lv.done{border-color:#2f8f6a;color:var(--mint)}
.lv.cur{background:linear-gradient(180deg,#ff9a85,var(--acc));color:#2a0d08;border-color:#ffc0b4}
.lv.lock{opacity:.3;cursor:default}
.lv.boss::after{content:'';position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--sun)}
.skins{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sk{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px}
.sk.eq{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.sk canvas{width:60px;height:60px}
.sk b{font-size:13px;font-weight:600}
.sk .btn{padding:6px 8px;font-size:12px;width:100%;box-sizing:border-box}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mute);border:1px solid transparent}
.cal div.on{background:linear-gradient(180deg,#ffe08a,var(--sun));color:#3a2600}
.cal div.today{border-color:var(--sun)}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb .play{font-size:21px;padding:12px 10px 11px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:12px;background:rgba(20,15,36,.95);border:1px solid var(--line);font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="menu">

      <div class="row"><button class="btn" id="worldsBtn"></button><button class="btn" id="skinsBtn"></button></div>
    </div>
  </div>
</div>

<div id="hud" hidden>
  <button class="ico" id="backBtn" aria-label="Pause">II</button>
  <div id="hudLbl"></div>
  <div class="chip"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffc94a"/></svg><span id="hudCoins">0</span></div>
</div>
<div id="tip" hidden></div>
<div id="failCard" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>

let AC=null,NB=null;
function ac(){if(!S.snd||mode==='demo')return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,vol,delay,slide){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,vol,freq){const a=ac();if(!a)return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=NB;f.type='bandpass';f.frequency.value=freq||800;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}catch(e){}}
const PENTA=[0,2,4,7,9];
const noteF=i=>{i=Math.min(i,16);return 392*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12)};

 win:()=>[0,2,4,5,7].forEach((k,j)=>tone(noteF(k+3),.24,'triangle',.11,j*.07)),
 gem:()=>{tone(1568,.1,'square',.04);tone(2093,.16,'square',.04,.06)},
 coin:()=>{tone(988,.08,'square',.04);tone(1319,.14,'square',.04,.07)},
 ring:()=>{tone(523,.5,'sine',.1,0,1046);noise(.4,.1,2400)}};

 if(tipT>900)tipT=.01}
function land(f){const ro=roAt(G.pulse,G.t),th=thAt(ro),rel=norm(Math.PI/2-G.rot);
 let hit=null;for(const p of G.pins){if(angDist(rel,p.a)<th){hit=p;break}}
 if(hit){crash(rel,hit);return}
 G.pins.push({a:rel,pop:1,num:f.num});G.hubPop=1;
 const idx=mode==='endless'?G.ring:G.total-G.rem-G.fly.length-1;SFX.pin(Math.max(0,idx));vib(8);

  const wa=g.a+G.rot,x=Math.cos(wa)*ro,y=Math.sin(wa)*ro;burst(x,y,['#ffe08a','#ffffff','#7af5ff'],22,180);pops.push({t:0,x,y:y-18,txt:'+3',c:'#ffc94a'})}}

 for(const p of G.pins){const wa=p.a+G.rot;burst(Math.cos(wa)*ro,Math.sin(wa)*ro,[pal().pin,pal().acc],5,220)}

 document.querySelectorAll('[data-c]').forEach(cn=>{const c=cn.getContext('2d');const g=c.createLinearGradient(0,0,120,120);g.addColorStop(0,p.bg[0]);g.addColorStop(1,p.bg[1]);c.fillStyle=g;rr(c,0,0,120,120,22);c.fill();
  c.strokeStyle=p.pin;c.lineWidth=4;c.beginPath();c.moveTo(60,112);c.lineTo(60,64);c.stroke();headPath(c,60,52,20,+cn.dataset.c,-Math.PI/2);c.fillStyle=p.pin;c.fill('evenodd')});
 $('#skClose').onclick=()=>{closeSheet();renderMenu()};
 document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.skin=+b.dataset.use;save();openSkins()});
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy;if(S.coins<SKINS[i].price){toastMsg(T.noCoins);return}S.coins-=SKINS[i].price;S.owned.push(i);S.skin=i;save();SFX.coin();toastMsg(T.bought);openSkins()});
 document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ad;window.AdKit.rewarded('skin').then(ok=>{if(ok){S.adSkin++;if(S.adSkin>=3&&!S.owned.includes(i)){S.owned.push(i);S.skin=i;toastMsg(T.bought)}save()}openSkins()})})}

/* ================= menü ================= */
function toMenu(){state='menu';closeSheet();$('#failCard').hidden=true;$('#hud').hidden=true;$('#tip').hidden=true;$('#menu').hidden=false;demo();renderMenu()}
function renderMenu(){T=TXT[S.lang]||TXT.en;document.documentElement.lang=S.lang;
 const cur=Math.min(S.max,MAXL),c=Math.floor((cur-1)/CHAP);
 $('#playTxt').textContent=T.play;$('#playSub').textContent=`${WICON[c]} ${T.world.toUpperCase()} ${c+1} · ${T.level.toUpperCase()} ${cur}`;$('#tagTxt').textContent=T.tag;
 $('#coinTxt').textContent=S.coins;$('#langBtn').textContent=S.lang.toUpperCase();$('#sndBtn').textContent=S.snd?'🔊':'🔇';$('#vibBtn').style.opacity=S.vib?1:.4;
 $('#sndBtn').setAttribute('aria-label',T.sound);$('#vibBtn').setAttribute('aria-label',T.vib);
 const done=S.daily.last===dkey();$('#dailyTxt').textContent=T.daily;$('#dailySub').textContent=done?T.dailyDone:(curStreak()?'🔥 '+fmt(T.streak,curStreak()):T.dailyNew);$('#dailyBtn').classList.toggle('hot',!done);
 $('#endlessTxt').textContent=T.endless;$('#endlessSub').textContent=fmt(T.best,S.best);
 $('#worldsBtn').textContent=T.worlds;$('#skinsBtn').textContent=T.skins}
$('#playBtn').onclick=()=>startLevel(Math.min(S.max,MAXL));
$('#dailyBtn').onclick=dailyInfo;$('#endlessBtn').onclick=startEndless;$('#worldsBtn').onclick=openWorlds;$('#skinsBtn').onclick=openSkins;
$('#sndBtn').onclick=()=>{S.snd=!S.snd;save();renderMenu();if(S.snd){const m=mode;mode='x';tone(660,.1,'triangle',.1);mode=m}};
$('#vibBtn').onclick=()=>{S.vib=!S.vib;save();renderMenu();if(S.vib)try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}};
$('#langBtn').onclick=()=>{S.lang=LANGS[(LANGS.indexOf(S.lang)+1)%LANGS.length];save();renderMenu()};

/* ================= girdi ================= */
function tapAct(){if(!$('#modal').hidden)return;
 if(state==='play'&&mode!=='demo')shoot();
 else if(state==='crash'&&G&&G.crash&&G.crash.t>.35)retry()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tapAct()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(mode!=='demo'&&document.activeElement===document.body){e.preventDefault();tapAct()}}
 else if((e.key==='Escape'||e.key==='p')&&state==='play')openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&mode!=='demo')openPause()});
addEventListener('adkit:start',()=>{if(state==='play'&&mode!=='demo')openPause()});

/* ================= çizim ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function headPath(c,x,y,r,sk,a){c.beginPath();
 switch(sk){
  case 1:c.arc(x,y,r,0,TAU);c.moveTo(x+r*.48,y);c.arc(x,y,r*.48,0,TAU,true);break;
  case 2:for(let k=0;k<10;k++){const rr_=k%2?r*.55:r*1.28,aa=a+k*Math.PI/5;k?c.lineTo(x+Math.cos(aa)*rr_,y+Math.sin(aa)*rr_):c.moveTo(x+Math.cos(aa)*rr_,y+Math.sin(aa)*rr_)}c.closePath();break;
  case 3:{const s=r*1.12,ca=Math.cos(a+Math.PI/2),sa=Math.sin(a+Math.PI/2),P=(u,v)=>[x+u*ca-v*sa,y+u*sa+v*ca];
   let p=P(0,s*.95);c.moveTo(p[0],p[1]);let q1=P(-s*1.5,-s*.05),q2=P(-s*.65,-s*1.15),q3=P(0,-s*.38);c.bezierCurveTo(q1[0],q1[1],q2[0],q2[1],q3[0],q3[1]);
   q1=P(s*.65,-s*1.15);q2=P(s*1.5,-s*.05);q3=P(0,s*.95);c.bezierCurveTo(q1[0],q1[1],q2[0],q2[1],q3[0],q3[1]);c.closePath();break}
  case 4:for(let k=0;k<4;k++){const aa=a+k*Math.PI/2,rr_=k%2?r*.85:r*1.3;k?c.lineTo(x+Math.cos(aa)*rr_,y+Math.sin(aa)*rr_):c.moveTo(x+Math.cos(aa)*rr_,y+Math.sin(aa)*rr_)}c.closePath();break;
  case 5:for(let k=0;k<5;k++){const aa=a+k*TAU/5,px=x+Math.cos(aa)*r*.62,py=y+Math.sin(aa)*r*.62;c.moveTo(px+r*.52,py);c.arc(px,py,r*.52,0,TAU)}c.moveTo(x+r*.5,y);c.arc(x,y,r*.5,0,TAU);break;
  default:c.arc(x,y,r,0,TAU)}}
function pal(){if(!LV)return PALS[0];if(mode==='daily')return DAILY_PAL;if(mode==='endless')return PALS[Math.floor(G.score/12)%PALS.length];return palOf(LV.c)}
function burst(x,y,cols,n,sp){for(let i=0;i<n&&parts.length<400;i++){const a=Math.random()*TAU,v=(.3+Math.random()*.7)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.6+Math.random()*.6,s:2+Math.random()*3,c:cols[i%cols.length]})}}
const BGD=[];for(let i=0;i<34;i++)BGD.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.4,s:.2+Math.random()*.8});
let bgCache={k:'',g:null};
function draw(dt){const c=ctx,p=pal(),t=performance.now()/1000;
 c.setTransform(DPR,0,0,DPR,0,0);
 const red=G?G.red:0;
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,p.bg[0]);g.addColorStop(1,p.bg[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
 if(red>0){c.globalAlpha=red*.92;c.fillStyle='#ef3e4a';c.fillRect(0,0,W,H);c.globalAlpha=1}
 if(G&&G.flash>0){c.globalAlpha=G.flash*.5;c.fillStyle=p.acc;c.fillRect(0,0,W,H);c.globalAlpha=1}
 // yüzen noktalar
 c.fillStyle=red>.5?'rgba(255,255,255,.12)':p.orb;for(const d of BGD){const y=((d.y*H-t*d.s*14)%H+H)%H;c.beginPath();c.arc(d.x*W,y,d.r*DPR/DPR,0,TAU);c.fill()}
 if(!G)return;
 const menu=mode==='demo',avail=LH-370-64,K=menu?clamp(avail/(RO0*2+40),.45,.95):1,cy=menu?64+avail/2:CY;
 const sx=(Math.random()-.5)*G.shake,sy=(Math.random()-.5)*G.shake;
 c.setTransform(DPR*SC*K,0,0,DPR*SC*K,(OX+(LW/2+sx)*SC)*DPR,(cy+sy)*SC*DPR);
 const ro=roAt(G.pulse,G.t),rot=G.rot,pinC=red>.5?'#ffffff':p.pin;
 // yörünge izi
 c.strokeStyle=red>.5?'rgba(255,255,255,.15)':p.orb;c.lineWidth=1.5;c.beginPath();c.arc(0,0,ro,0,TAU);c.stroke();
 // elmaslar
 for(const gm of G.gems){if(gm.hit)continue;const wa=gm.a+rot,x=Math.cos(wa)*ro,y=Math.sin(wa)*ro,s=8+Math.sin(t*5+gm.a)*1.5;
  c.save();c.translate(x,y);c.rotate(wa);c.shadowColor='#7af5ff';c.shadowBlur=14;c.fillStyle='#7af5ff';c.beginPath();c.moveTo(s,0);c.lineTo(0,s*.75);c.lineTo(-s,0);c.lineTo(0,-s*.75);c.closePath();c.fill();
  c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.moveTo(s*.4,0);c.lineTo(0,s*.3);c.lineTo(-s*.1,0);c.closePath();c.fill();c.restore()}
 // çubuklar
 if(p.glow&&red<.5){c.shadowColor=p.pin;c.shadowBlur=8}
 c.strokeStyle=pinC;c.lineWidth=2;c.lineCap='round';c.beginPath();
 for(const q of G.pins){const wa=q.a+rot;c.moveTo(0,0);c.lineTo(Math.cos(wa)*ro,Math.sin(wa)*ro)}c.stroke();
 for(const q of G.pins){const wa=q.a+rot,x=Math.cos(wa)*ro,y=Math.sin(wa)*ro,hit=G.crash&&G.crash.hit===q;
  headPath(c,x,y,BRAD*(1+q.pop*.4),S.skin,wa);c.fillStyle=hit?'#ffffff':pinC;c.fill('evenodd');
  if(q.pop>0){q.pop=Math.max(0,q.pop-dt*5)}}
 c.shadowBlur=0;
 // çarpan top
 if(G.crash){const y=ro,cr=G.crash;cr.t+=dt;  headPath(c,0,y,BRAD*1.15,S.skin,Math.PI/2);c.fillStyle='#ffffff';c.fill('evenodd');c.strokeStyle='#ef3e4a';c.lineWidth=2.5;c.stroke()}
 // göbek
 const hp=G.hubPop,hr=44*(1+hp*.08);
 if(p.glow&&red<.5){c.shadowColor=p.hub;c.shadowBlur=24}
 c.fillStyle=red>.5?'#ffffff':p.hub;c.beginPath();c.arc(0,0,hr,0,TAU);c.fill();c.shadowBlur=0;
 let label=mode==='endless'?String(G.score):mode==='daily'?'★':String(LV.L);
 c.fillStyle=red>.5?'#ef3e4a':p.hubT;c.textAlign='center';c.textBaseline='middle';
 c.font=`700 ${label.length>=3?26:32}px Fredoka,'Arial Rounded MT Bold',sans-serif`;c.fillText(label,0,2);
 // kuyruk
 if(!menu){const q0=qY0(),vis=mode==='endless'?6:Math.min(G.rem,9);
  for(let k=0;k<vis;k++){const y=q0+k*QGAP+G.qOff;if((cy+y)>LH+20)break;const a=k>=6?1-(k-5)/4:1;c.globalAlpha=a;
   headPath(c,0,y,BRAD*1.15,S.skin,-Math.PI/2);c.fillStyle=red>.5?'#ffffff':pinC;c.fill('evenodd');
   if(mode!=='endless'&&S.skin!==1){c.fillStyle=red>.5?'#ef3e4a':p.num;c.font=`600 ${G.rem-k>=10?10:11}px Fredoka,sans-serif`;c.fillText(String(G.rem-k),0,y+.5)}}
  c.globalAlpha=1}
 // uçan toplar
 for(const f of G.fly){headPath(c,0,f.y,BRAD*1.15,S.skin,-Math.PI/2);c.fillStyle=pinC;c.fill('evenodd');c.globalAlpha=.25;c.fillRect(-1,f.y,2,24);c.globalAlpha=1}
 // parçacıklar ve yazılar
 for(const q of parts){c.globalAlpha=Math.max(0,1-q.t/q.life);c.fillStyle=q.c;c.beginPath();c.arc(q.x,q.y,q.s,0,TAU);c.fill()}c.globalAlpha=1;
 for(const q of pops){const a=q.t<.12?q.t/.12:1-Math.max(0,q.t-.8)/.4;if(a<=0)continue;c.globalAlpha=a;c.font='700 20px Fredoka,sans-serif';c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.35)';c.strokeText(q.txt,q.x,q.y);c.fillStyle=q.c;c.fillText(q.txt,q.x,q.y)}c.globalAlpha=1}

/* ================= döngü ================= */
function update(dt){if(!G)return;
 if(tipT>0&&tipT<900){tipT-=dt;if(tipT<=0)$('#tip').hidden=true}
 if(state==='play'||state==='win'){G.t+=dt;
  let om=omegaAt(G.m,G.t);if(state==='win'){G.winT+=dt;G.boost*=Math.exp(-1.6*dt);om+=G.boost}
  if(mode==='demo')om*=.8;
  G.rot+=om*dt;
  const ro=roAt(G.pulse,G.t);
  for(const f of G.fly)f.y-=2400*dt;
  while(state==='play'&&G.fly.length&&G.fly[0].y<=ro){const f=G.fly.shift();land(f);if(!G)return}
  if(mode==='demo'&&state==='play'){G.botT-=dt;
   if(G.botT<=0&&!G.fly.length){const rel=norm(Math.PI/2-G.rot),th=thAt(ro);
    if(G.rem>0&&G.pins.every(q=>angDist(rel,q.a)>th*1.9)){shoot();G.botT=.5+Math.random()*.9}}}}
 if(state==='crash'){G.red=Math.min(1,G.red+dt*7)}
 G.qOff=Math.max(0,G.qOff-dt*240);G.hubPop=Math.max(0,G.hubPop-dt*5);G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*2);
 for(const q of parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97}parts=parts.filter(q=>q.t<q.life);
 for(const q of pops){q.t+=dt;q.y-=dt*26}pops=pops.filter(q=>q.t<1.2)}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw(dt);requestAnimationFrame(loop)}
addEventListener('resize',resize);resize();
if(location.hash==='#test')window.__T={genLevel,omegaAt,roAt,thAt,angDist,get G(){return G},get S(){return S},get state(){return state},startLevel,startDaily,startEndless,toMenu,shoot};
toMenu();requestAnimationFrame(loop);
})();
