<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Golazo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Golazo — Sampa Games. Tam ekran tuval (mantıksal genişlik 400, en çok 520px) + DOM katmanları. Tek koyu görünüm (stadyum gecesi). */
:root{
  --night:#06140d; --night2:#0e2a1d; --ink:#f3fff7; --mute:#9cc4ad; --line:#1f4a34;
  --lime:#3ee07f; --sun:#ffd23f; --pink:#ff4f8b; --sky:#2fb8ff;
  --disp:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* menü */
#menu{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;background:linear-gradient(180deg,rgba(6,20,13,.2),rgba(6,20,13,.82) 42%,var(--night))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--disp);font-size:clamp(58px,18vw,86px);line-height:.9;text-align:center;margin:14px 0 0;text-shadow:0 6px 0 rgba(0,0,0,.4)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:.2s}.logo span:nth-child(3n){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tag{text-align:center;color:var(--mute);font-weight:800;font-size:15px;margin:-4px 0 4px}
.play{border:0;border-radius:20px;padding:16px 18px 14px;font-family:var(--disp);font-size:32px;letter-spacing:.03em;color:#062312;background:linear-gradient(180deg,#8dffb5,var(--lime));box-shadow:0 6px 0 #138a45,0 14px 30px rgba(62,224,127,.3);line-height:1}
.play small{display:block;font-family:var(--body);font-weight:900;font-size:13px;letter-spacing:.06em;margin-top:5px;opacity:.75}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #138a45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--night2);border:1px solid var(--line);font-weight:900;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--night2);border-radius:14px;padding:11px 13px;font-weight:800;font-size:14px}
.btn.sun{background:linear-gradient(180deg,#ffe27a,var(--sun));color:#3a2800;border-color:#ffe9a0;box-shadow:0 4px 0 #a07a00}
.btn.sun:active{transform:translateY(3px);box-shadow:0 1px 0 #a07a00}
.btn.pink{background:linear-gradient(180deg,#ff8ab2,var(--pink));color:#2a0b1a;border-color:#ffb3cc;box-shadow:0 4px 0 #a3194c}
.btn:disabled{opacity:.4;cursor:default}
.adtag{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.18);margin-right:5px;vertical-align:1px}
.how{background:var(--night2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d3eadc}
.how b{color:var(--ink)}
.how .ln{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.how i{font-style:normal;font-size:16px;line-height:1.3}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:0}
.sect span{color:var(--mute);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
/* tur etapları */
.stages{display:flex;flex-direction:column;gap:10px}
.stage{background:var(--night2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage.cur{border-color:#2f7a52}
.stage-head{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.stage-ic{font-size:26px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.stage-txt{min-width:0}
.stage-name{font-family:var(--disp);font-size:20px;line-height:1.05}
.stage-place{font-size:11px;color:var(--mute);font-weight:900;letter-spacing:.07em;text-transform:uppercase;margin-top:2px}
.stage-prog{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.stage-prog i{display:block;height:100%;background:var(--lime);border-radius:4px}
.stage-stars{font-weight:900;font-size:13px;color:var(--sun);font-variant-numeric:tabular-nums;text-align:right}
.stage-stars small{display:block;color:var(--mute);font-size:11px}
.stage.locked .stage-head{opacity:.45}
.stage-new{font-size:13px;color:#cfe9da;padding:0 14px 10px;line-height:1.4}
.stage .grid{padding:0 12px 12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;border:1px solid var(--line);background:#0a2016;font-family:var(--disp);font-size:20px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lv .st{font-family:var(--body);font-size:10px;letter-spacing:1px;color:var(--sun)}
.lv .st em{font-style:normal;color:#2f5a44}
.lv .md{position:absolute;top:3px;left:5px;font-size:11px;line-height:1}
.lv.done{border-color:#2f7a52}
.lv.cur{background:linear-gradient(180deg,#8dffb5,var(--lime));color:#062312;border-color:#b6ffd0}
.lv.cur .st,.lv.cur .st em{color:#062312}.lv.cur .st em{opacity:.3}
.lv.lock{opacity:.3;cursor:default}
.lv.boss::after{content:'';position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.foot{color:var(--mute);font-size:12px;text-align:center;line-height:1.5}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
#hud .lvname{font-family:var(--disp);font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
.hspace{flex:1}
.hchip{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;background:rgba(4,16,10,.62);border:1px solid rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(4,16,10,.62);font-weight:900;font-size:15px;letter-spacing:-1px}
#hud2{position:fixed;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:8px;pointer-events:none}
#goalDots{display:flex;gap:5px;align-items:center}
#goalDots i{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:block}
#goalDots i.on{background:var(--lime);border-color:var(--lime);box-shadow:0 0 10px var(--lime)}
#bottomBar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#guideBtn{pointer-events:auto;border-radius:14px;padding:9px 12px;font-weight:900;font-size:14px;border:1px solid rgba(255,255,255,.2);background:rgba(4,16,10,.7)}
#guideBtn.on{background:linear-gradient(180deg,#ffe27a,var(--sun));color:#3a2800;border-color:#ffe9a0}
#ballsRow{display:flex;gap:4px;font-size:18px}
#ballsRow span{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#ballsRow span.used{opacity:.22}
#hint{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:900;color:rgba(243,255,247,.9);font-size:15px;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7);padding:0 20px}

/* pencereler */
.modal{position:fixed;inset:0;background:rgba(2,10,6,.74);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:370px;max-height:calc(100% - 20px);overflow-y:auto;background:linear-gradient(180deg,#123a27,#0a2216);border:1px solid #2a6447;border-radius:24px;padding:22px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.mt{font-family:var(--disp);font-size:36px;line-height:1;margin:0}
.ms{color:var(--mute);font-weight:700;margin:-6px 0 0;font-size:14px}
.big-ic{font-size:56px;line-height:1}
.bigstars{font-size:44px;letter-spacing:6px;color:var(--sun);line-height:1;text-shadow:0 3px 0 #8a6200}
.bigstars em{font-style:normal;color:#24513a;text-shadow:none}
.bigstars span{display:inline-block;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) backwards}
.bigstars span:nth-child(2){animation-delay:.18s}.bigstars span:nth-child(3){animation-delay:.36s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:8px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb .play{font-size:22px;padding:13px 10px 11px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:rgba(0,0,0,.22);border:1px solid #2a6447;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.item.eq{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.item canvas{width:56px;height:56px}
.item b{font-size:14px}
.item .btn{padding:7px 10px;font-size:13px;width:100%}
.ups{display:flex;flex-direction:column;gap:10px;text-align:left}
.up{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.22);border:1px solid #2a6447;border-radius:16px;padding:10px}
.up .ic{font-size:26px;text-align:center}
.up b{font-size:15px}
.up p{margin:2px 0 6px;font-size:12px;color:var(--mute);line-height:1.35}
.pips{display:flex;gap:4px}
.srow{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:800;margin-top:3px}
.up canvas{width:56px;height:40px}
.up.eq{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.pips i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--lime)}
.up .btn{padding:8px 10px;font-size:13px;white-space:nowrap;min-width:0}
.up .btn:disabled{white-space:normal;max-width:84px;font-size:12px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:12px;background:rgba(6,24,15,.95);border:1px solid var(--line);font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
/* ilerleme */
.prof{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;background:var(--night2);border:1px solid var(--line);border-radius:18px;padding:10px 14px;text-align:left;width:100%;box-sizing:border-box}
.lvb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:24px;color:#062312;background:radial-gradient(circle at 35% 30%,#d4ffe2,var(--lime));box-shadow:0 4px 0 #138a45}
.pinfo{min-width:0}.pinfo b{font-family:var(--disp);font-weight:400;font-size:19px}
.xpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin:6px 0 3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--sun));border-radius:6px;transition:width .6s}
.xpn,.pinfo small{color:var(--mute);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.ptsb{font-weight:900;font-size:12px;color:#3a2800;background:var(--sun);border-radius:999px;padding:4px 9px;white-space:nowrap}
.quad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:var(--night2);font-weight:900;font-size:13px;min-width:0}
.qbtn i{font-style:normal;font-size:26px;line-height:1}
.bdg{position:absolute;top:-6px;right:-4px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;box-sizing:border-box;box-shadow:0 2px 0 #a3194c;animation:bdg 1.6s ease-in-out infinite}
@keyframes bdg{50%{transform:scale(1.12)}}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:rgba(0,0,0,.22);border:1px solid #2a6447;border-radius:14px;padding:10px 12px}
.mis.done{border-color:var(--lime)}.mis b{font-size:14px}.mis small{color:var(--mute);font-weight:800;font-size:12px}
.mis .pbar{height:7px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin:6px 0 4px}.mis .pbar i{display:block;height:100%;background:var(--lime)}
.mbtns{display:flex;flex-direction:column;gap:6px}.mbtns .btn{padding:7px 10px;font-size:13px}
.okm{font-size:22px;color:var(--lime);font-weight:900}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tab{display:flex;flex-direction:column;align-items:center;padding:5px 7px;border-radius:12px;border:1px solid var(--line);background:var(--night2);font-size:20px;line-height:1}
.tab small{font-size:10px;font-weight:900;color:var(--mute);margin-top:2px}
.tab.on{border-color:var(--lime);background:#14402a}.tab.lock{opacity:.35}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;perspective:600px}.card canvas{width:100%;height:auto;display:block;border-radius:10px}
.card .cnt{position:absolute;bottom:22%;right:6px;font-size:11px;font-weight:900;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 5px}
.pack .card{animation:flip .7s cubic-bezier(.2,1.3,.4,1) backwards}.pack .card:nth-child(2){animation-delay:.4s}.pack .card:nth-child(3){animation-delay:.8s}
@keyframes flip{from{transform:rotateY(100deg) scale(.6);opacity:0}}
.tagn{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:8px;white-space:nowrap}
.tagn.dup{background:#355e49}
.lvup{background:linear-gradient(90deg,rgba(62,224,127,.18),rgba(255,210,63,.18));border:1px solid var(--sun);border-radius:14px;padding:8px 10px;font-weight:900;display:flex;flex-direction:column;gap:2px}
.lvup small{color:var(--mute);font-weight:800}
.xprow{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;margin-bottom:-8px}
.xprow b{color:var(--lime);font-size:18px}.xprow span{color:var(--mute);font-size:13px}
.pcrest{width:44px;height:44px}
.tmprev{display:flex;justify-content:center;gap:10px}.tmprev canvas{width:120px;height:120px}
.fld{display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:800;font-size:13px;color:var(--mute)}.fld input{font:inherit;font-size:17px;font-weight:900;color:#fff;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sub{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;margin-bottom:-6px}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pal{aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.15);padding:0}.pal.on{border-color:#fff;box-shadow:0 0 0 2px var(--lime)}
.opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.opts .btn{padding:7px 10px;font-size:13px;width:auto}
.vs{display:flex;align-items:center;justify-content:center;gap:12px}.vs canvas{width:64px;height:64px}.vs b{font-family:var(--disp);font-size:40px;font-weight:400}.vs.sm canvas{width:40px;height:40px}.vs.sm b{font-size:18px;font-family:inherit;font-weight:900}.vs span{color:var(--sun);font-weight:900}
.cuplist{display:flex;flex-direction:column;gap:6px}.cuprow{display:grid;grid-template-columns:20px 1fr 36px auto;gap:8px;align-items:center;text-align:left;background:rgba(0,0,0,.22);border:1px solid #2a6447;border-radius:12px;padding:6px 10px}.cuprow canvas{width:36px;height:36px}.cuprow small{display:block;color:var(--mute);font-size:11px;font-weight:800}.cuprow em{font-style:normal;font-size:12px;font-weight:900;color:var(--sun);white-space:nowrap}.cuprow.cur{border-color:var(--sun)}.cuprow.w{border-color:var(--lime);opacity:.75}.cuprow.l{border-color:var(--pink);opacity:.6}.cst{font-weight:900}
.lgh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-8px}.lgh small{color:var(--mute);font-weight:800}
.lgt{display:flex;flex-direction:column;gap:3px}.lgr{display:grid;grid-template-columns:20px 26px 1fr auto;gap:8px;align-items:center;text-align:left;padding:4px 8px;border-radius:9px;background:rgba(0,0,0,.18);font-size:14px}.lgr canvas{width:24px;height:24px}.lgr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lgr em{font-style:normal;font-weight:900;font-variant-numeric:tabular-nums}.lgr.up span{color:var(--lime)}.lgr.down span{color:var(--pink)}.lgr.me{background:rgba(255,210,63,.18);outline:1px solid var(--sun)}
.scrollbox{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.vid{width:100%;max-height:44vh;border-radius:14px;background:#000;object-fit:contain}
#goalDots b.cupn{font-size:11px;font-weight:900;margin:0 2px}#goalDots b.cups{white-space:nowrap;font-family:var(--disp);font-size:18px;margin:0 6px;font-weight:400}#goalDots i.x{background:var(--pink);border-color:var(--pink)}
#socBtn{width:100%}
#mCard{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);width:min(340px,88vw);background:linear-gradient(180deg,rgba(10,34,22,.96),rgba(6,20,13,.96));border:1px solid #2a6447;border-radius:22px;padding:14px 14px 12px;z-index:40;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.msb{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900}.msb canvas{width:40px;height:40px}.msb b{font-family:var(--disp);font-size:38px;font-weight:400;margin:0 6px;min-width:84px}
.mclk{display:inline-block;margin:6px 0 4px;background:var(--lime);color:#06251a;font-weight:900;border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.mln{font-weight:900;font-size:17px;margin-top:4px}.mtag{background:var(--sun);color:#3a2800;border-radius:7px;padding:1px 7px;margin-right:4px}
.mtk{margin-top:8px;display:flex;flex-direction:column;gap:3px;min-height:20px}.mtk div{font-size:12.5px;color:var(--mute);font-weight:800}.mtk div.bad{color:var(--pink)}

// aimX/aimY: kale çizgisindeki hedef; B: falso yay sapması (m, + sağa); v: top hızı (m/s); ground: yerden şut.

function makeShot(sp,aimX,aimY,B,v,ground){

/* ---------- kaleci fiziği ----------

 * Dalış: leğen bir mermi gibi fırlatılır (yatay + dikey hız, yerçekimi), yere düşünce kayar.
 * Eller leğenden en fazla KL metre uzanır ve refleksle topa yönelir; çarpışma gövde, el ve bacak parçalarıyla hesaplanır.
 * Ortaya gelen yavaş top tutulur, diğerleri çelinir. */
const KL=1.0;
function kInit(sp){return{x:sp.kx0,vx:0,mode:'stand',P:[sp.kx0,.9],V:[0,0],H:[sp.kx0,1.24],T:[0,1],dir:0,t:0,caught:false,g:0,gh:1,ph:0,fall:0}}
function kLaunch(k,sp,px,py,tt){
 const side=px>=k.x?1:-1,dist=Math.abs(px-k.x),tf=clamp(tt,.16,.45);

 if(dist<.4){k.mode='air';k.dir=0;k.V=[(px-k.x)/tf,clamp((Math.min(Math.max(py,1.2)-.95,1.3)+.5*GR*tf*tf)/tf*.5,.6,3.6)];return}

function keeperStep(st,dt){const k=st.k,sp=st.sp,b=st.b;k.t+=dt;
 const fly=st.phase==='fly'&&!st.res&&b.vz>0&&b.z<sp.kz;
 if(k.mode==='stand'){let tx=k.x;
  if(sp.user){if(k.req&&fly){const tt=(sp.kz-b.z)/b.vz;kLaunch(k,sp,k.req.x,k.req.y,Math.max(.16,tt));k.req=null}}
  else if(sp.pen){if(fly&&st.t>sp.delay){const tt=(sp.kz-b.z)/b.vz;kLaunch(k,sp,k.g===0?(k.gh>1.5?0:k.x):k.g*2.6,k.gh,Math.max(.22,tt))}}
  else if(fly&&st.t>sp.delay){const tt=(sp.kz-b.z)/b.vz,useAcc=b.z>sp.D*.5;
   let px=b.x+b.vx*tt+.5*(useAcc?b.ax:sp.wind*.4)*tt*tt+sp.err*Math.min(1,tt/.55);
   const py=Math.max(BR,b.y+b.vy*tt-.5*GR*tt*tt);px=clamp(px,-GW-.2,GW+.2);tx=clamp(px,-GW+.4,GW-.4);
   if(tt<sp.react&&(Math.abs(px-k.x)>.4||py>1.6))kLaunch(k,sp,px,py,tt)}
  if(k.mode==='stand'){const want=clamp((tx-k.x)*9,-sp.vk,sp.vk);k.vx+=clamp(want-k.vx,-20*dt,20*dt);k.x=clamp(k.x+k.vx*dt,-GW+.3,GW-.3);k.P=[k.x,.9];k.H=[k.x,1.24]}}
 if(k.mode==='air'||k.mode==='ground'){
  if(k.mode==='air'){k.V[1]-=GR*dt;k.P[0]+=k.V[0]*dt;k.P[1]+=k.V[1]*dt;
   if(k.dir===0&&k.P[1]<=.9&&k.V[1]<0&&k.t>.1){k.mode='stand';k.x=k.P[0];k.vx=k.V[0]*.3;k.P=[k.x,.9];k.H=[k.x,1.24]}  // dikey sıçrayış: ayakları üstüne iner
   else if(k.P[1]<=.24&&k.V[1]<0&&k.t>.12){k.mode='ground';k.P[1]=.24;k.V[1]=0;k.t=0}}
  else{k.V[0]*=Math.exp(-5*dt);k.P[0]+=k.V[0]*dt}

  let tgt=k.T;if(!st.res&&b.z>sp.kz-7&&b.vz>0)tgt=[b.x,b.y];if(k.mode==='ground'&&k.t>.15&&!k.caught)tgt=[k.P[0]+(k.dir||1)*KL,.3];

function newShotState(sp){return{sp,b:{x:sp.bx,y:BR,z:0,vx:0,vy:0,vz:0,ax:0,rot:0,v:0,spin:0},k:kInit(sp),

function stepShot(st,dt){
 const b=st.b,sp=st.sp;
 if(st.phase!=='fly')return;

 const pz=b.z;
 b.vx+=b.ax*dt;b.vy-=GR*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;

  if(b.vy<-1){// gerçek sekme: hız kaybı ve zıplama
   const e=sp.theme==='playa'?.22:sp.rain?.3:.5,f=sp.theme==='playa'?.6:sp.rain?.95:.85;
   if(b.vy<-1.2)st.bounce=1;b.vy=-b.vy*e;b.vx*=f;b.vz*=f;b.ax*=.6;if(Math.abs(b.vy)<.6)b.vy=0}
  else b.vy=0}                                   // yerde yuvarlanıyor: yalnızca aşağıdaki yuvarlanma sürtünmesi
 // yerde yuvarlanma sürtünmesi (kumda çok, ıslak çimde az)
 if(b.y<=BR+.001&&b.vy===0){const m=Math.exp(-(sp.theme==='playa'?1.1:sp.rain?.08:.22)*dt);b.vx*=m;b.vz*=m;b.ax*=Math.exp(-2*dt)}
 if(st.inNet){if(b.z>sp.D+NETD-.15){if(!st.netHit)st.netHit={x:b.x,y:b.y};b.z=sp.D+NETD-.15;b.vz=-Math.abs(b.vz)*.08;b.vx*=.3;b.vy*=.4;b.ax=0;st.net=1}
  if(Math.abs(b.x)>GW-BR){b.x=Math.sign(b.x)*(GW-BR);b.vx*=-.2}if(b.y>GH-BR){b.y=GH-BR;b.vy=-Math.abs(b.vy)*.2}}

 if(st.postShake>0)st.postShake=Math.max(0,st.postShake-dt*1.8);

 if(main&&main.jump&&!st.wp[0]){const tt=(main.z-b.z)/Math.max(b.vz,.1);if(tt<.4)st.jump=Math.min(1,st.jump+dt*5)}else st.jump=Math.max(0,st.jump-dt*2.5);

  if(pz<w.z&&b.z>=w.z&&b.vz>0){st.wp[i]=true;if(st.res)continue;
   const top=sp.wallH+(w.jump?st.jump*.38*Math.sin(Math.min(1,st.jump)*Math.PI/2):0),wx=wallX(w,st.clock),hw=w.line?.36:.29;
   if(Math.abs(b.x-wx)<hw+BR&&b.y<top+BR){st.res='block';st.contact={x:b.x,y:b.y,z:w.z};b.z=w.z-.05;b.vz=-Math.abs(b.vz)*.22;b.vy=Math.abs(b.vy)*.3+1.5;b.vx=b.vx*.3+(b.x-wx)*3;b.ax=0}}}

  if(!st.res&&!st.keeperPassed&&pz<sp.kz&&b.z>=sp.kz&&b.vz>0){st.keeperPassed=true;keeperHit(st)}}

  if(!st.res){const ax=Math.abs(b.x);

function simulate(sp,shot){const st=newShotState(sp);shoot(st,shot);let n=0;while(st.phase!=='done'&&n<2000){stepShot(st,1/120);n++}return st}

const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1,OX=0,LW=400,LH=800,F=960,CX=200,CY=300;
const CAM={x:0,y:1.75,z:-5.6,c:1,s:0,yaw:0};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
 const cw=Math.min(W,520);SC=cw/LW;OX=(W-cw)/2;LH=H/SC;F=LW*2.35;CX=LW/2;CY=clamp(LH*.41,230,420)}
function setCam(sp,fwd){fwd=fwd||0;const len=Math.hypot(sp.bx,sp.D),dx=-sp.bx/len,dz=sp.D/len;const yaw=Math.atan2(dx,dz);CAM.c=Math.cos(yaw);CAM.s=Math.sin(yaw);CAM.yaw=yaw;
 CAM.x=sp.bx-dx*(5.6-fwd);CAM.z=-dz*(5.6-fwd);CAM.y=1.75-fwd*.03}
function toCam(x,y,z){const dx=x-CAM.x,dz=z-CAM.z;return[dx*CAM.c-dz*CAM.s,y-CAM.y,dx*CAM.s+dz*CAM.c]}
function pc(p){const s=F/p[2];return[CX+p[0]*s,CY-p[1]*s,s]}
function proj(x,y,z){const p=toCam(x,y,z);if(p[2]<.3)return null;return pc(p)}
function unproject(sx,sy,zPlane){const rx=(sx-CX)/F,ry=-(sy-CY)/F;const wx=rx*CAM.c+CAM.s,wz=-rx*CAM.s+CAM.c,wy=ry;if(wz<=.05)return null;const t=(zPlane-CAM.z)/wz;return{x:CAM.x+wx*t,y:CAM.y+wy*t}}
function clipPoly(pts){const out=[],N=.3;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const ai=a[2]>=N,bi=b[2]>=N;if(ai)out.push(a);if(ai!==bi){const t=(N-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,N])}}return out}
function polyW(c,pw){const cp=clipPoly(pw.map(p=>toCam(p[0],p[1],p[2])));if(cp.length<3)return false;c.beginPath();cp.forEach((p,i)=>{const q=pc(p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();return true}
function lineW(c,a,b){let p=toCam(a[0],a[1],a[2]),q=toCam(b[0],b[1],b[2]);const N=.3;if(p[2]<N&&q[2]<N)return;if(p[2]<N){const t=(N-p[2])/(q[2]-p[2]);p=[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,N]}else if(q[2]<N){const t=(N-q[2])/(p[2]-q[2]);q=[q[0]+(p[0]-q[0])*t,q[1]+(p[1]-q[1])*t,N]}

const BOOTS=[{pow:1,curl:1,ctl:1,price:0,c:'#8f959e',c2:'#ffffff'},{pow:2,curl:1,ctl:2,price:150,c:'#ffd23f',c2:'#1b1d2a'},{pow:2,curl:3,ctl:2,price:320,c:'#2fb8ff',c2:'#ffffff'},

/* Çizdiğin yol = topun yolu
 * Çizgi topun üstünden başlıyormuş gibi kaydırılır (parmak nereden başlarsa başlasın).
 * Hedef: çizginin bittiği ekran noktası kale düzlemine iz düşürülür → topun kaleye vardığı (x, yükseklik).
 *   Çizgi kale ağzının tabanına ulaşmadan biterse son doğrultusunda tabana kadar uzatılır → yerden şut.
 * Falso: çizginin kirişten ortadaki sapması (piksel) topun yarı yoldaki derinliğinde metreye çevrilir; 6 px altı titreme sayılır.
 * Hız: son 150 ms'deki en yüksek parmak hızı (%75) + tüm çizimin hızı (%25) → 16 m/s ile kramponun tavanı arası. Rastgele sapma yok. */
function shotPath(pts){if(!ST||pts.length<2)return null;const sp=ST.sp,bp=proj(sp.bx,BR,0);if(!bp)return null;

function swipeToShot(raw){const pts=shotPath(raw);if(!pts)return null;const sp=ST.sp,a=pts[0],last=pts[pts.length-1];
 let total=0;for(let i=1;i<pts.length;i++)total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
 const dx=last.x-a.x,dy=last.y-a.y,len=Math.hypot(dx,dy);
 if(len<28||dy>-15)return null;
 // hedef ve gerekirse uzatma
 let ex=last.x,ey=last.y,hit=unproject(ex,ey,sp.D);if(!hit)return null;let ext=false;
 if(hit.y<BR){let k=pts.length-1;while(k>0&&Math.hypot(last.x-pts[k].x,last.y-pts[k].y)<len*.3)k--;
  let ux=last.x-pts[k].x,uy=last.y-pts[k].y;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;if(uy>-.2){uy=-.2;const n=Math.hypot(ux,uy);ux/=n;uy/=n}
  for(let i=0;i<500&&hit&&hit.y<BR;i++){ex+=ux*2;ey+=uy*2;hit=unproject(ex,ey,sp.D)}ext=true;if(!hit)return null}
 const ground=hit.y<.32;
 const ax=clamp(hit.x,-GW-8,GW+8),ay=ground?BR:clamp(hit.y,BR,6);
 // kavis
 let dev=0,n=0;for(const p of pts){const u=((p.x-a.x)*dx+(p.y-a.y)*dy)/(len*len);if(u<.2||u>.8)continue;dev+=(dx*(p.y-a.y)-dy*(p.x-a.x))/len;n++}
 dev=n?dev/n/.84:0;if(Math.abs(dev)<6)dev=0;else dev-=Math.sign(dev)*6;

 let peak=0;for(let i=pts.length-1;i>0&&last.t-pts[i].t<150;i--){let j=i;while(j>0&&pts[i].t-pts[j].t<30)j--;const dt_=pts[i].t-pts[j].t;if(dt_>=12)peak=Math.max(peak,Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)/dt_)}

 return out.slice(0,Math.max(2,Math.ceil(out.length*frac)))}

function addXP(n){n=Math.round(n);if(n<=0)return;S.xp+=n;if(G)G.xp+=n;
 while(S.lvl<MAXLV&&S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;S.pts++;const c=40+S.lvl*10,pk=S.lvl%2===0;S.coins+=c;if(pk)S.packs++;

function progShot(st,ok){const sp=st.sp,info=st.shot||{v:0,B:0,ground:false};
 if(!ok){streak=0;updStreak();addXP(3*fameMult());return{mult:1}}

 if(isGoal){misInc('goal');if(sp.pen)misInc('pen')}

 if(isGoal&&st.pre&&st.pre.great){tags.push([T.tg.golazo,20]);misInc('golazo')}

 tags.forEach((t,i)=>FX.pops.push({text:t[0]+'  +'+t[1],x:LW/2,y:CY*.6+58+i*21,t:-.25-i*.13,c:'#ffd23f',al:'center'}));
 FX.pops.push({text:'+'+xp+' XP'+(mult>1?'   🔥 x'+fmtM(mult):''),x:LW/2,y:CY*.6+62+tags.length*21,t:-.3-tags.length*.13,c:'#3ee07f',al:'center'});

function openPack(){if(S.packs<=0)return null;S.packs--;const maxP=availPages(),pool=[];
 for(let id=0;id<(maxP+1)*6;id++)pool.push([id,[10,4,1][cardRar(id)]]);
 const tot=pool.reduce((a,b)=>a+b[1],0),roll=()=>{let x=Math.random()*tot;for(const[i,w]of pool){x-=w;if(x<=0)return i}return pool[0][0]};
 const out=[];for(let k=0;k<3;k++){let id=roll();if(S.alb.own[id])id=roll();               // tekrar gelirse bir kez daha çekilir
  const isNew=!S.alb.own[id];S.alb.own[id]=(S.alb.own[id]||0)+1;if(!isNew)S.coins+=10;out.push({id,isNew})}
 const done=[];for(let pg=0;pg<6;pg++){if(S.alb.pages[pg])continue;let all=true;for(let i=0;i<6;i++)if(!S.alb.own[pg*6+i])all=false;if(all){S.alb.pages[pg]=1;S.coins+=200;S.pts++;done.push(pg)}}

 rr(c,1,1,w-2,h-2,12);if(rar===2){const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff3b0');g.addColorStop(.5,'#ffd23f');g.addColorStop(1,'#b88a00');c.fillStyle=g}else c.fillStyle=frame;c.fill();

 c.save();rr(c,6,6,w-12,h-12,8);c.clip();
 if(rar>0){c.globalAlpha=rar===2?.3:.15;c.fillStyle='#fff';for(let k=0;k<12;k++){const a=k/12*TAU;c.beginPath();c.moveTo(w/2,h*.4);c.lineTo(w/2+Math.cos(a)*w,h*.4+Math.sin(a)*w);c.lineTo(w/2+Math.cos(a+.14)*w,h*.4+Math.sin(a+.14)*w);c.fill()}c.globalAlpha=1}
 const kit=KITS[(id*5+2)%KITS.length],skin=SKINS[(id*3+1)%SKINS.length],hair=HAIRS[(id*7)%HAIRS.length];
 const cx=w/2,hy=h*.38,hr=w*.17;
 c.fillStyle=kit[0];c.beginPath();c.moveTo(cx-w*.46,h*.82);c.quadraticCurveTo(cx-w*.44,h*.55,cx-hr*.9,h*.55);c.lineTo(cx+hr*.9,h*.55);c.quadraticCurveTo(cx+w*.44,h*.55,cx+w*.46,h*.82);c.closePath();c.fill();
 c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.moveTo(cx+w*.1,h*.56);c.quadraticCurveTo(cx+w*.44,h*.55,cx+w*.46,h*.82);c.lineTo(cx+w*.1,h*.82);c.closePath();c.fill();
 c.fillStyle=shade(skin,-.18);c.fillRect(cx-hr*.38,hy+hr*.55,hr*.76,hr*.75);
 c.strokeStyle=kit[1];c.lineWidth=w*.035;c.lineJoin='round';c.beginPath();c.moveTo(cx-hr*.75,h*.555);c.lineTo(cx,h*.63);c.lineTo(cx+hr*.75,h*.555);c.stroke();
 c.fillStyle=skin;c.beginPath();c.ellipse(cx,hy,hr*.85,hr,0,0,TAU);c.fill();
 c.fillStyle=skin;c.beginPath();c.ellipse(cx-hr*.85,hy+hr*.1,hr*.16,hr*.24,0,0,TAU);c.ellipse(cx+hr*.85,hy+hr*.1,hr*.16,hr*.24,0,0,TAU);c.fill();
 c.fillStyle=hair;const hs=id%4;
 if(hs===0){c.beginPath();c.ellipse(cx,hy-hr*.42,hr*.92,hr*.64,0,Math.PI,0);c.fill()}
 else if(hs===1){c.beginPath();c.ellipse(cx,hy-hr*.4,hr*.92,hr*.6,0,Math.PI,0);c.fill();for(let k=-2;k<=2;k++){c.beginPath();c.arc(cx+k*hr*.36,hy-hr*.85,hr*.3,0,TAU);c.fill()}}
 else if(hs===2){c.beginPath();c.ellipse(cx,hy-hr*.5,hr*.9,hr*.55,0,Math.PI,0);c.fill();c.fillRect(cx-hr*.95,hy-hr*.55,hr*.24,hr*1.25);c.fillRect(cx+hr*.71,hy-hr*.55,hr*.24,hr*1.25)}
 else{c.beginPath();c.ellipse(cx,hy-hr*.55,hr*.82,hr*.38,0,Math.PI,0);c.fill();c.fillRect(cx-hr*.22,hy-hr*1.2,hr*.44,hr*.6)}
 c.fillStyle='#1a120c';c.beginPath();c.arc(cx-hr*.32,hy+hr*.05,hr*.1,0,TAU);c.arc(cx+hr*.32,hy+hr*.05,hr*.1,0,TAU);c.fill();
 c.strokeStyle='#1a120c';c.lineWidth=hr*.09;c.lineCap='round';c.beginPath();c.arc(cx,hy+hr*.32,hr*.32,.35,Math.PI-.35);c.stroke();
 c.fillStyle=kit[1];c.font=`${w*.17}px "Lilita One",Impact,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(String([1,4,2,8,10,9][i]),cx,h*.715);
 c.restore();
 c.fillStyle='rgba(0,0,0,.75)';c.fillRect(6,h*.8,w-12,h*.2-6);
 let fs=w*.1;c.font=`900 ${fs}px Nunito,sans-serif`;while(c.measureText(ALB_NAMES[id]).width>w-18&&fs>7){fs-=.5;c.font=`900 ${fs}px Nunito,sans-serif`}
 c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(ALB_NAMES[id],cx,h*.865);
 c.fillStyle=frame;c.font=`900 ${w*.075}px Nunito,sans-serif`;c.fillText(T.pos[i]+' · '+T.rar[rar],cx,h*.935);
 c.font=`${w*.13}px sans-serif`;c.textAlign='left';c.textBaseline='top';c.fillText(STAGES[pg].icon,11,10);
 c.textAlign='right';c.fillStyle='rgba(255,255,255,.85)';c.font=`900 ${w*.08}px Nunito,sans-serif`;c.fillText('#'+(id+1),w-11,12)}

function drawCrest(c,x,y,r,tm){const P=PALS[tm.pal]||PALS[0],ini=teamInitials(tm.n);
 const shape=()=>{c.beginPath();if(tm.cr===0){c.moveTo(-r*.86,-r*.9);c.lineTo(r*.86,-r*.9);c.lineTo(r*.86,r*.1);c.quadraticCurveTo(r*.8,r*.72,0,r);c.quadraticCurveTo(-r*.8,r*.72,-r*.86,r*.1);c.closePath()}

 c.save();c.translate(x,y);shape();c.fillStyle=P[0];c.fill();c.save();c.clip();c.fillStyle=P[1];
 if(tm.pat===1)for(let k=-2;k<=2;k+=2)c.fillRect(k*r*.32-r*.12,-r,r*.24,2*r);

 else if(tm.pat===4)c.fillRect(0,-r,r,2*r);

function kitPattern(c,a1,a2,b1,b2,pat,col){const Q=(u,v)=>{const tx=lerp(a1[0],a2[0],u),ty=lerp(a1[1],a2[1],u),bx=lerp(b1[0],b2[0],u),by=lerp(b1[1],b2[1],u);return[lerp(tx,bx,v),lerp(ty,by,v)]};
 const poly=pts=>{c.beginPath();pts.forEach((p,i)=>{const q=Q(p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();c.fill()};
 c.save();c.fillStyle=col;
 if(pat===1)for(let k=1;k<6;k+=2)poly([[k/6,0],[(k+1)/6,0],[(k+1)/6,1],[k/6,1]]);
 else if(pat===2)for(let k=1;k<5;k+=2)poly([[0,k/5],[1,k/5],[1,(k+1)/5],[0,(k+1)/5]]);
 else if(pat===3)poly([[0,.04],[.3,0],[1,.72],[1,1],[.72,1],[0,.34]]);
 else if(pat===4)poly([[.5,0],[1,0],[1,1],[.5,1]]);
 c.restore()}

 path();c.fillStyle=P[0];c.fill();c.save();path();c.clip();kitPattern(c,[w*.04,h*.1],[w*.96,h*.1],[w*.27,h*.94],[w*.73,h*.94],tm.pat,P[1]);c.restore();

 drawCrest(c,w*.62,h*.36,h*.1,tm);c.restore()}

function leagueState(){const wk=weekKey();if(!S.lg)S.lg={wk,div:0,days:{}};
 if(S.lg.wk!==wk){const old=S.lg,tbl=leagueTable(true,old),mine=tbl.find(r=>r.me);
  if(mine.pts>0){const rank=tbl.indexOf(mine)+1,from=old.div,to=rank<=3?Math.min(4,from+1):rank>=8?Math.max(0,from-1):from,c=[300,200,150,60,60,60,60,20,20,20][rank-1];
   S.coins+=c;if(to>from)statInc('promos');S.lg={wk,div:to,days:{},res:{rank,from,to,c}}}else S.lg={wk,div:old.div,days:{}};save();achCheck()}
 return S.lg}
function leagueTable(full,lgIn){const lg=lgIn||S.lg,r=mulberry(hashStr('lg'+lg.wk+'|'+lg.div)),p=CLUBS.map((_,i)=>i);
 for(let i=p.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
 const base=DIVS_BASE[lg.div],now=new Date(),di=dayIdx(),frac=(now.getHours()*60+now.getMinutes())/1440;
 const rows=p.slice(0,9).map(ci=>{let pts=0;for(let d=0;d<7;d++){const play=r()<.82,v=Math.round(base*(.5+r()*.95)/10)*10;if(!play)continue;if(full||d<di)pts+=v;else if(d===di)pts+=Math.round(v*frac/10)*10}return{club:ci,name:CLUBS[ci].n,pts}});
 rows.push({me:true,name:myTeam().n,pts:sum(Object.values(lg.days))});return rows.sort((a,b)=>b.pts-a.pts)}

let REC=null;
function bestCapture(st){if(!st.snap||!st.shotObj||!G)return;const info=st.shot||{},great=!!(st.pre&&st.pre.great);
 const score=(great?1000:0)+(st.top?300:0)+(st.ring?200:0)+info.v*3+info.B*100;
 if(!G.best||score>G.best.score)G.best={snap:st.snap,shot:st.shotObj,score,great,kmh:Math.round(info.v*3.6)}}
function recStart(){REC=null;try{if(!cv.captureStream||!window.MediaRecorder)return;
 const types=['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'],mt=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}});if(!mt)return;
 const r=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:4000000}),ch=[];r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};r.start(250);REC={r,ch,mt}}catch(e){REC=null}}
function recStop(){return new Promise(res=>{if(!REC){res(null);return}const R=REC;REC=null;const to=setTimeout(()=>res(null),4000);
 R.r.onstop=()=>{clearTimeout(to);res(R.ch.length?new Blob(R.ch,{type:R.mt.split(';')[0]}):null)};try{R.r.stop()}catch(e){clearTimeout(to);res(null)}})}
function startReplay(){if(!G||!G.best)return;closeSheet();['#hud','#hud2','#bottomBar','#hint'].forEach(s=>$(s).hidden=true);
 ST=JSON.parse(G.best.snap);ST.drawn=null;ST.trail=[];ST.pre=null;msg=null;parts=[];
 Object.assign(FX,{camF:0,fade:0,slow:1,slowT:1,hold:0,shake:0,flash:0,cheer:0,pops:[],rings:[]});
 FX.rp={t:0,hold:0,ending:false,shot:G.best.shot,kmh:G.best.kmh};state='replay';recStart()}
function replayStep(dt,gdt){const R=FX.rp;R.t+=dt;
 if(ST.phase==='aim'&&R.t>.8){shoot(ST,R.shot);SFX.kick(R.shot.v);FX.shake=4;FX.squash=1;const p=screenOf(ST.b.x,BR,0);if(p)FX.rings.push({x:p.x,y:p.y,r:p.s*.15,t:0,c:'255,255,255'})}
 if(ST.phase==='fly'){const b=ST.b,sp=ST.sp;if(!ST.res&&b.vz>0){const tt=(sp.D-b.z)/b.vz;FX.slowT=tt<.45&&tt>0?.3:1}
  for(let i=0;i<4;i++){const had=ST.res;stepShot(ST,gdt/4);if(!had&&ST.res)replayResult()}
  if(ST.res){R.hold+=dt;if(R.hold>.6)FX.slowT=1}
  const cm=sp.pen?2.2:Math.max(0,Math.min(sp.D*.42,sp.walls.length?sp.walls[0].z-3:99));if(!ST.res||ST.res==='goal')FX.camF+=(clamp(b.z*.45,0,cm)-FX.camF)*Math.min(1,dt*3.5)}
 if(ST.phase==='done'&&!R.ending){R.ending=true;setTimeout(endReplay,500)}}
function replayResult(){const r=ST.res;if(r==='goal'){showMsg(FX.rp&&G.best.great?T.GOAL:T.GOL,'#3ee07f');SFX.net();SFX.cheer();FX.cheer=1;FX.flash=.3;FX.shake=8;burst(LW/2,CY+20,['#ffd23f','#3ee07f','#2fb8ff','#ff4f8b','#ffffff'],130,430)}}

 c.fillStyle='rgba(0,0,0,.72)';c.fillRect(0,0,LW,46);c.fillRect(0,LH-62,LW,62);
 c.fillStyle=Math.floor(t*2)%2?'#ff3b3b':'#a01818';c.beginPath();c.arc(18,23,6,0,TAU);c.fill();
 c.fillStyle='#fff';c.font='900 14px Nunito,sans-serif';c.textAlign='left';c.textBaseline='middle';c.fillText(T.replay.toUpperCase(),30,23);

async function shareBlob(blob){const ext=blob.type.includes('mp4')?'mp4':'webm',name='golazo-'+Date.now()+'.'+ext,text=T.shareTxt+' '+STORE_URL;

 ['Deportivo La Esquina','Atlético Callejón','Unión Potrero','Sporting Mercado','Club Las Palmas','Juventud Obrera','Real Arrabal','Estrella del Puerto'],
 CLUBS.slice(0,8).map(c=>c.n),CLUBS.slice(8,16).map(c=>c.n),

function carClub(t,i){const src=t===1?CLUBS[i]:t===2?CLUBS[8+i]:null;if(src)return{n:src.n,pal:src.pal,pat:src.pat,cr:src.cr};
 return{n:CAR_N[t][i],pal:(i*3+t*2+1)%10,pat:(i+t)%5,cr:(i+t)%3}}

function carAgeF(a){return a<=21?1.35:a<=25?1.1:a<=29?.8:a<=31?.45:.2}
function poisson(l,r){let k=0,p=Math.exp(-l),s=p,u=r();while(u>s&&k<6){k++;p*=l/k;s+=p}return k}
// 8 takım, 7 hafta: daire yöntemi
function carRounds(){const a=[0,1,2,3,4,5,6,7],out=[];for(let r=0;r<7;r++){const pr=[];for(let k=0;k<4;k++)pr.push([a[k],a[7-k]]);out.push(pr);a.splice(1,0,a.pop())}return out}

 c.str=[0,1,2,3,4,5,6,7].map(()=>1+Math.floor(r()*5));c.str[c.c]=Math.max(c.str[c.c],2);
 c.rounds=carRounds();for(let i=c.rounds.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[c.rounds[i],c.rounds[j]]=[c.rounds[j],c.rounds[i]]}

 const order=['L','L','C','L','L','C','L','L','C','L'];let li=0,ci=0;
 c.sched=order.map(k=>k==='L'?{k,r:li++}:{k,r:ci++});
 c.cup={alive:true,rd:0,won:false,opp:[]};const pool=[0,1,2,3,4,5,6,7].filter(i=>i!==c.c);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}c.cup.opp=pool.slice(0,3);

// ---- maç ----
function carMatch(){carSkip();const c=S.car;if(c.md>=c.sched.length){openCar();return}
 const e=c.sched[c.md],t=c.t,opp=carOppOf(e),O=carClub(t,opp),M=carClub(t,c.c),r=Math.random,base=CAR_T[t].base;
 const diff=clamp(CAR_T[t].d+(c.str[opp]-3)*.15-(c.ovr-base)/25,0,3);
 const n=5+(c.ovr>=base+6?1:0),pool=['fk','one','edge','pass','pen','one','fk','edge','pass'];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const types=['fk','one',...pool.slice(0,n-2)];for(let i=types.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[types[i],types[j]]=[types[j],types[i]]}
 if(types[0]==='pass'){const k=types.findIndex(x=>x!=='pass');[types[0],types[k]]=[types[k],types[0]]}
 const mins=types.map((_,i)=>Math.floor(4+(i+r()*.8)*(84/n)));
