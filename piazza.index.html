<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Piazza</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Piazza — Sampa Games. Avrupa pazarlarında 3'lü ürün sıralama. DOM tahta + tuval efekt katmanı. Sıcak gündüz görünümü (Viyana gecesi). */
:root{
  --ink:#3a2618; --mute:#8a6a52; --paper:#fff8ec; --paper2:#f6e6cc; --line:#e3cba6;
  --wood:#c4864b; --wood2:#8c5426; --gold:#ffc83d; --green:#2fa36b; --pink:#ff4f8b;
  --a:#d8343f; --b:#fff4ea; --sky1:#ffe2b8; --sky2:#ffb27a; --stone:#c9a98a;
  --disp:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;font-family:var(--body);color:var(--ink);background:var(--sky2);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 46%,var(--stone) 46%,var(--stone));transition:background .4s}
#bg::after{content:'';position:absolute;left:0;right:0;top:46%;bottom:0;opacity:.5;
  background-image:radial-gradient(ellipse 17px 10px at 50% 50%,rgba(255,255,255,.28) 62%,transparent 66%),radial-gradient(ellipse 17px 10px at 50% 50%,rgba(0,0,0,.10) 62%,transparent 66%);
  background-size:38px 24px,38px 24px;background-position:0 0,19px 12px}
#bg .city{position:absolute;left:0;right:0;top:calc(46% - 120px);height:120px;opacity:.55}
.night #bg::before{content:'';position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 8%,#fff,transparent),radial-gradient(1px 1px at 45% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 25%,#fff,transparent),radial-gradient(1px 1px at 10% 30%,#fff,transparent)}
.awning{position:fixed;left:0;right:0;top:0;height:calc(22px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(90deg,var(--a) 0 28px,var(--b) 28px 56px);z-index:1;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.awning::after{content:'';position:absolute;left:0;right:0;top:100%;height:14px;
  background:radial-gradient(circle at 14px 0,var(--a) 13.5px,transparent 14.5px) 0 0/56px 14px repeat-x,radial-gradient(circle at 42px 0,var(--b) 13.5px,transparent 14.5px) 0 0/56px 14px repeat-x;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}

/* menü */
#menu{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;z-index:2;padding:calc(46px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.btn.gold{background:linear-gradient(180deg,#ffe07a,var(--gold));border-color:#f0b020;color:#4a3000;box-shadow:0 4px 0 #b88200}
.btn.pink{background:linear-gradient(180deg,#ff8ab2,var(--pink));border-color:#ff9cbf;color:#3a0b1e;box-shadow:0 4px 0 #a3194c}
.btn:disabled{opacity:.45;cursor:default}
.logo{font-family:var(--disp);font-size:clamp(64px,20vw,96px);line-height:.9;text-align:center;margin:8px 0 0;letter-spacing:.01em}
.logo span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 rgba(58,38,24,.35);animation:bob 2.6s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:.25s}.logo span:nth-child(3n){animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tag{text-align:center;color:var(--ink);font-weight:800;font-size:15px;margin:-2px 0 4px;opacity:.8}
.play{border:0;border-radius:20px;padding:15px 18px 13px;font-family:var(--disp);font-size:32px;letter-spacing:.03em;color:#fff;background:linear-gradient(180deg,#5fd18f,var(--green));box-shadow:0 6px 0 #1b7247,0 14px 26px rgba(47,163,107,.3);line-height:1;-webkit-text-stroke:1px rgba(0,0,0,.15)}
.play small{display:block;font-family:var(--body);font-weight:900;font-size:13px;letter-spacing:.06em;margin-top:5px;opacity:.9;-webkit-text-stroke:0}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #1b7247}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.daily{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;font:inherit}
.daily .ic{font-size:30px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ffe9b8}
.daily b{font-family:var(--disp);font-weight:400;font-size:20px;display:block;line-height:1.05}
.daily span{font-size:12px;color:var(--mute);font-weight:800}
.daily em{font-style:normal;font-weight:900;color:#c45a00;font-size:13px;white-space:nowrap}
.bchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-weight:900;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bchip i{font-style:normal;font-size:24px}
.adtag{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.12);margin-right:4px;vertical-align:1px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sect h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:0;-webkit-text-stroke:0}
.sect span{color:var(--ink);font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.stages{display:flex;flex-direction:column;gap:10px}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.stage-head{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:none;border:0;text-align:left;font:inherit}
.stage-ic{font-size:28px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden}
.stage-ic::before{content:'';position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,var(--sa) 0 8px,var(--sb) 8px 16px)}
.stage-name{font-family:var(--disp);font-size:19px;line-height:1.05;display:block}
.stage-place{font-size:11px;color:var(--mute);font-weight:900;letter-spacing:.07em;text-transform:uppercase;margin-top:2px;display:block}
.stage-prog{height:6px;border-radius:4px;background:rgba(0,0,0,.08);margin-top:6px;overflow:hidden;display:block}
.stage-prog i{display:block;height:100%;background:var(--green);border-radius:4px}
.stage-stars{font-weight:900;font-size:13px;color:#c48a00;font-variant-numeric:tabular-nums;text-align:right}
.stage-stars small{display:block;color:var(--mute);font-size:11px}
.stage.locked .stage-head{opacity:.5}
.stage-new{font-size:13px;color:var(--ink);padding:0 14px 10px;line-height:1.4;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 12px 12px}
.lv{position:relative;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#fffdf7;font-family:var(--disp);font-size:19px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lv .st{font-family:var(--body);font-size:10px;letter-spacing:1px;color:#e0a000}
.lv .st em{font-style:normal;color:#e8dcc8}
.lv.done{border-color:#9fd6b6;background:#f2fff7}
.lv.cur{background:linear-gradient(180deg,#5fd18f,var(--green));color:#fff;border-color:#1b7247}
.lv.cur .st,.lv.cur .st em{color:#fff}.lv.cur .st em{opacity:.35}
.lv.lock{opacity:.35;cursor:default}
.lv.boss::after{content:'';position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.how{display:grid;gap:8px;font-size:14px;line-height:1.45}
.how .ln{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.how i{font-style:normal;font-size:17px;line-height:1.3}
.foot{color:var(--ink);opacity:.6;font-size:12px;text-align:center;line-height:1.5;margin:0}

/* oyun ekranı */
#hud{position:fixed;left:0;right:0;top:calc(30px + env(safe-area-inset-top,0px));z-index:3;padding:0 12px;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.hrow{display:flex;align-items:center;gap:8px;max-width:500px;margin:0 auto;width:100%}
#hudLv{font-family:var(--disp);font-size:19px;white-space:nowrap;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:4px 10px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.timer{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.08);min-width:0}
.timer .ic{font-size:17px;line-height:1}
.tbar{flex:1;height:10px;border-radius:6px;background:#f0e2c8;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5fd18f,var(--green));border-radius:6px;transform-origin:left;transition:background .3s}
.timer b{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;min-width:38px;text-align:right}
.timer.warn{border-color:#ff9a9a;animation:warn .5s ease-in-out infinite alternate}
.timer.warn .tbar i{background:linear-gradient(90deg,#ff7a7a,#e5383b)}
.timer.frozen{border-color:#8fd3ff;background:#eaf7ff}.timer.frozen .tbar i{background:linear-gradient(90deg,#9fe0ff,#3aa8e8)}
@keyframes warn{to{transform:scale(1.04)}}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:900;font-size:14px;letter-spacing:-1px;box-shadow:0 3px 0 rgba(0,0,0,.08);flex:none}
.prow{display:flex;justify-content:center;gap:8px;max-width:500px;margin:0 auto;width:100%}
.hchip{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;background:var(--paper);border:2px solid var(--line);padding:3px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.hchip .pbar{width:90px;height:8px;border-radius:5px;background:#f0e2c8;overflow:hidden}
.hchip .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
#board{position:fixed;left:0;right:0;top:calc(124px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:2}
#boosters{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:center;gap:14px}
.bst{position:relative;width:70px;height:70px;border-radius:22px;border:3px solid var(--line);background:var(--paper);font-size:32px;line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.14);display:grid;place-items:center;padding:0}
.bst:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.bst b{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--green);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 5px;box-sizing:border-box;border:2px solid #fff}
.bst b.plus{background:var(--gold);color:#4a3000}
.bst small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;color:var(--ink)}

/* raflar */
.shelf{position:absolute;--sl:60px}
.shelf .cab{position:absolute;left:0;right:0;top:12%;bottom:calc(var(--sl)*.1);border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#f7dfb9,#e9c592);box-shadow:inset 0 0 0 3px rgba(140,84,38,.25),inset 0 -14px 18px rgba(140,84,38,.18)}
.shelf .plank{position:absolute;left:-3%;right:-3%;bottom:0;height:calc(var(--sl)*.17);border-radius:6px;background:linear-gradient(180deg,var(--wood),var(--wood2));box-shadow:0 4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25)}
.shelf.hot .plank{box-shadow:0 0 0 3px #fff,0 0 18px 4px var(--gold)}
.shelf.hot .cab{box-shadow:inset 0 0 0 3px var(--gold)}
.shelf .peek{position:absolute;left:4%;right:4%;top:15%;height:calc(var(--sl)*.5);display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none}
.shelf .peek span{font-size:calc(var(--sl)*.42);line-height:1;text-align:center;filter:brightness(.72) saturate(.55);opacity:.8}
.shelf .front{position:absolute;left:1%;right:1%;bottom:calc(var(--sl)*.15);height:var(--sl);display:grid;grid-template-columns:repeat(3,1fr)}
.slot{position:relative;display:flex;align-items:flex-end;justify-content:center}
.it{position:relative;font-size:calc(var(--sl)*.7);line-height:1;transform-origin:50% 100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));transition:transform .14s;padding-bottom:2px}
.it.mov{cursor:grab}
.it.sel{transform:translateY(-10%) scale(1.14);filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px var(--gold))}
.it.lift{opacity:.2}
.it.rise{animation:rise .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes rise{from{transform:translateY(-38%) scale(.65);filter:brightness(.6)}}
.it.gold::before{content:'';position:absolute;left:50%;bottom:8%;width:84%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,215,90,.9),rgba(255,200,60,0) 70%);z-index:-1;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.45}}
.icebox{position:absolute;left:-6%;right:-6%;top:-4%;bottom:-2%;border-radius:22%;background:linear-gradient(135deg,rgba(225,247,255,.5),rgba(150,210,255,.28));border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 0 8px rgba(255,255,255,.9),0 0 6px rgba(120,190,255,.6);font-style:normal}
.icebox b{position:absolute;right:-4px;top:-6px;font-size:11px;font-family:var(--body);font-weight:900;background:#3aa8e8;color:#fff;border-radius:8px;padding:0 5px;border:2px solid #fff}
.depth{position:absolute;right:-6px;top:6%;font-size:11px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:8px;padding:1px 6px;border:2px solid var(--paper);z-index:1}
.lockov{position:absolute;left:-2%;right:-2%;top:10%;bottom:0;border-radius:12px;background:repeating-linear-gradient(45deg,rgba(92,62,40,.9) 0 12px,rgba(120,82,52,.9) 12px 24px);display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);z-index:2}
.lockov div{background:var(--paper);border-radius:14px;padding:4px 10px;font-weight:900;font-size:calc(var(--sl)*.28);display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lockov.open{animation:unlock .5s forwards}
@keyframes unlock{to{transform:translateY(-30%) scale(1.1);opacity:0}}
.ghost{position:fixed;z-index:8;pointer-events:none;line-height:1;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));transform:translate(-50%,-70%) scale(1.18)}
.fly{position:fixed;z-index:7;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
.pop{position:fixed;z-index:9;pointer-events:none;font-family:var(--disp);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap;transform:translate(-50%,-50%)}
.hand{position:fixed;z-index:9;pointer-events:none;font-size:44px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#tip{position:fixed;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:4;text-align:center;pointer-events:none}
#tip span{display:inline-block;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;line-height:1.35;border-radius:14px;padding:8px 14px;max-width:420px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* pencereler */
.modal{position:fixed;inset:0;background:rgba(40,24,12,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:370px;max-height:calc(100% - 20px);overflow-y:auto;background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:0 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:13px;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1);position:relative}
.sheet::before{content:'';display:block;height:18px;margin:0 -18px;border-radius:22px 22px 0 0;background:repeating-linear-gradient(90deg,var(--a) 0 22px,var(--b) 22px 44px)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.mt{font-family:var(--disp);font-size:34px;line-height:1;margin:4px 0 0}
.ms{color:var(--mute);font-weight:800;margin:-6px 0 0;font-size:14px}
.big-ic{font-size:58px;line-height:1;margin-top:6px}
.bigstars{font-size:46px;letter-spacing:6px;color:var(--gold);line-height:1;-webkit-text-stroke:2px #b07a00}
.bigstars em{font-style:normal;color:#eadcc4;-webkit-text-stroke:2px #d9c6a4}
.bigstars span{display:inline-block;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) backwards}
.bigstars span:nth-child(2){animation-delay:.18s}.bigstars span:nth-child(3){animation-delay:.36s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper2);border-radius:12px;padding:8px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:900}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb .play{font-size:22px;padding:13px 10px 11px}
.col{display:flex;flex-direction:column;gap:9px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 130px);transform:translateX(-50%);z-index:20;padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="bg"><svg class="city" id="city" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg></div>
<div class="awning"></div>

<div id="menu">
  <div class="wrap">
    <div class="top">
      <div class="chip"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffc83d" stroke="#b07a00" stroke-width="2"/></svg><span id="coinTxt">0</span></div>
      <div class="row">
        <button class="btn" id="langBtn" aria-label="Language">EN</button>
        <button class="btn" id="sndBtn" aria-label="Sound">🔊</button>
      </div>
    </div>
    <h1 class="logo" id="logo" aria-label="Piazza"></h1>
    <p class="tag" id="tagTxt"></p>
    <button class="play" id="playBtn"><span id="playTxt">PLAY</span><small id="playSub">LEVEL 1</small></button>
    <button class="card daily" id="dailyBtn"><span class="ic">📅</span><span><b id="dailyT"></b><span id="dailyS"></span></span><em id="dailyE"></em></button>
    <div class="bchips" id="bchips"></div>
    <div class="row" style="justify-content:center"><button class="btn pink" id="giftBtn" hidden></button></div>
    <div class="sect"><h2 id="tourTitle">Tour</h2><span id="starSum">0</span></div>
    <div class="stages" id="stages"></div>
    <div class="card how" id="howBox"></div>
    <p class="foot" id="footTxt"></p>
  </div>
</div>

<div id="hud" hidden>
  <div class="hrow">

   if(fr[s].length===0&&li[s]+1<lay[s].length){li[s]++;fr[s]=lay[s][li[s]].slice();ch=true}}}return M}
 function rec(fr,li,M,dep){if(M*3===total)return true;if(++nodes>limit||dep>maxDep)return false;
  const key=li.join(',')+'|'+fr.map(f=>f.map(x=>x.id).sort((a,b)=>a-b).join('.')).join('/');
  if(seen.has(key))return false;seen.add(key);

function noise(d,vol,freq,q,type,delay){const a=ac();if(!a)return;try{if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NOISE.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(delay||0);s.buffer=NOISE;f.type=type||'bandpass';f.frequency.value=freq||900;f.Q.value=q||.7;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}catch(e){}}

function layoutBoard(){const n=G.sh.length,r=$('#board').getBoundingClientRect(),gx=12,gy=10,W_=Math.min(r.width-20,520),H_=r.height-6;
 const fit=c=>{const rw=Math.ceil(n/c);return Math.min((W_-gx*(c-1))/c/3.15,(H_-gy*(rw-1))/rw/1.72,96)};
 const cols=n<=2?n:[2,3,4].reduce((b,c)=>fit(c)>fit(b)+1?c:b,2),rows=Math.ceil(n/cols);
 let sl=fit(cols);
 const shW=sl*3.15,shH=sl*1.72,totW=cols*shW+(cols-1)*gx,totH=rows*shH+(rows-1)*gy;
 const oy=Math.max(0,(r.height-totH)/2),pos=[];
 for(let i=0;i<n;i++){const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),c=i-row*cols,rowW=inRow*shW+(inRow-1)*gx;
  pos.push([(r.width-rowW)/2+c*(shW+gx),oy+row*(shH+gy)])}
 LAY={sl,shW,shH,pos}}

function emptySlot(s,pref){const f=front(s);if(pref!=null&&!f[pref])return pref;for(let k=0;k<3;k++)if(!f[k])return k;return -1}
function tryMove(s,k,t,k2,fromRect){
 if(isBusy()||s===t||!movable(s,k)||lockedS(t)){if(lockedS(t))lockShake(t);return false}
 const k3=emptySlot(t,k2);if(k3<0){shelfShake(t);SFX.bad();return false}
 const it=front(s)[k];front(t)[k3]=it;front(s)[k]=null;G.moves++;
 sel=null;SFX.drop();vib(8);hideHand();
 if(G.tut&&G.moves===1)tip(T.tut2);
 normalize();renderBoard();updHud();flip(it.id,fromRect);
 later(settle,150);return true}
function normalize(){G.sh.forEach(sh=>{while(sh.layers.length>1&&!sh.layers[0].some(Boolean)){sh.layers.shift();sh.layers[0].forEach(it=>{if(it){it.w=false;G.rise.add(it.id)}})}})}
function tripleOf(s){const f=front(s);return f[0]&&f[1]&&f[2]&&f[0].t===f[1].t&&f[1].t===f[2].t}
function settle(){if(!G||state==='menu')return;
 const hits=[];G.sh.forEach((sh,s)=>{if(tripleOf(s))hits.push(s)});
 if(hits.length){hits.forEach(s=>{const items=front(s).slice();clearItems(items.map(it=>({it,s})),s);G.sh[s].layers[0]=[null,null,null]});
  normalize();renderBoard();updHud();later(settle,260);return}
 checkEnd()}

function clearItems(list,s){const rects=list.map(o=>{const el=elOf(o.it.id);return el?el.getBoundingClientRect():null});
 const m=MARKETS[G.mi];G.M++;G.left-=3;

 let cn=1+(G.combo>1?G.combo-1:0);list.forEach(o=>{if(o.it.g)cn+=5});G.coins+=cn;S.coins+=cn;save();
 G.sh.forEach(sh=>{if(sh.lock&&sh.lock===G.M){sh.justOpened=true;SFX.unlock()}});
 SFX.match(G.combo);vib(G.combo>2?[20,30,40]:18);
 let cx=0,cy=0,nn=0;rects.forEach((r,i)=>{if(!r)return;nn++;cx+=r.left+r.width/2;cy+=r.top+r.height/2});
 if(!nn&&s!=null&&LAY){const br=$('#board').getBoundingClientRect(),p=LAY.pos[s];cx=br.left+p[0]+LAY.shW/2;cy=br.top+p[1]+LAY.shH*.6;nn=1}
 cx/=nn;cy/=nn;
 rects.forEach((r,i)=>{if(!r)return;const d=document.createElement('div');d.className='fly';d.textContent=m.goods[list[i].it.t];
  d.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${LAY.sl*.7}px;display:flex;align-items:flex-end;justify-content:center`;
  document.body.appendChild(d);const dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
  d.animate([{transform:'scale(1)'},{transform:'scale(1.32) translateY(-12%)',offset:.35},{transform:`translate(${dx}px,${dy-10}px) scale(.15)`,opacity:.2}],{duration:380,easing:'cubic-bezier(.5,0,.8,.6)'}).onfinish=()=>d.remove()});
 setTimeout(()=>{burst(cx,cy,m.fx,26+G.combo*6,260+G.combo*30);ring(cx,cy)},300);
 if(G.combo>1)popText(T.combo+' x'+G.combo,cx,cy-LAY.sl*.6,22+Math.min(14,G.combo*3),'#ffc83d');
 if(G.combo>=3)setTimeout(()=>popText(T.praise[Math.min(4,G.combo-3)],innerWidth/2,innerHeight*.42,40,'#ff4f8b'),120);
 if(list.some(o=>o.it.g))setTimeout(()=>{popText('+5 🪙',cx,cy-LAY.sl,20,'#ffc83d');SFX.coin()},250)}
function shelfShake(s){const el=$(`.shelf[data-s="${s}"]`);if(el)el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220})}
function lockShake(s){shelfShake(s);SFX.bad();toastMsg((G.sh[s].lock-G.M)+' '+T.lockLeft)}
function hasMove(){const n=G.sh.length;let src=false,dst=false;
 for(let s=0;s<n;s++){if(lockedS(s))continue;const f=front(s);for(let k=0;k<3;k++){if(!f[k])dst=true;else if(!iced(f[k]))src=true}}
 if(!src||!dst)return false;
 // en az bir ürün, kendi rafından başka bir rafa gidebiliyor mu?
 for(let s=0;s<n;s++){if(lockedS(s))continue;if(!front(s).some(it=>it&&!iced(it)))continue;for(let t=0;t<n;t++)if(t!==s&&!lockedS(t)&&emptySlot(t)>=0)return true}
 return false}

function renderBoosters(){$('#boosters').innerHTML=BST.map(b=>{const n=S.bst[b.k]||0;return`<button class="bst" data-b="${b.k}" aria-label="${T.b[b.k]}">${b.ic}<b class="${n?'':'plus'}">${n||'+'}</b><small>${T.b[b.k]}</small></button>`}).join('')}
$('#boosters').addEventListener('click',e=>{const b=e.target.closest('.bst');if(!b||state!=='play'||isBusy())return;useBooster(b.dataset.b)});
function useBooster(k,free){if(!free&&!(S.bst[k]>0)){buySheet(k);return}
 let ok=false;
 if(k==='shuffle')ok=smartShuffle();else if(k==='hint')ok=magnet();else if(k==='freeze'){G.freeze=15;SFX.freeze();toastMsg(T.freezeOn);ok=true;updTimer()}
 if(ok&&!free){S.bst[k]--;save()}renderBoosters()}
function smartShuffle(){const n=G.sh.length,slots=[],items=[],rects={};
 for(let s=0;s<n;s++){if(lockedS(s))continue;const f=front(s);for(let k=0;k<3;k++){const it=f[k];if(it&&iced(it))continue;slots.push([s,k]);if(it){items.push(it);const el=elOf(it.id);if(el)rects[it.id]=el.getBoundingClientRect();f[k]=null}}}
 if(!items.length)return false;
 const by={};items.forEach(it=>{(by[it.t]=by[it.t]||[]).push(it)});
 const groups=Object.values(by).sort((a,b)=>b.length-a.length);
 const free3=[],other=[];const per={};slots.forEach(([s,k])=>{(per[s]=per[s]||[]).push(k)});
 Object.keys(per).forEach(s=>{if(per[s].length===3)free3.push(+s);else other.push(+s)});
 shuffle(free3,Math.random);
 // önce 3'lüler boş raflara, sonra kalanlar karışık
 const rest=[];groups.forEach(g=>{while(g.length>=3&&free3.length){const s=free3.pop();[0,1,2].forEach(k=>{front(s)[k]=g.pop()})}rest.push(...g)});
 shuffle(rest,Math.random);const left=[];free3.forEach(s=>per[s].forEach(k=>left.push([s,k])));other.forEach(s=>per[s].forEach(k=>left.push([s,k])));
 // aynı türden 2 ürünü, içinde o türden 1 tane olan raflara yerleştirmeyi dene
 shuffle(left,Math.random);rest.forEach((it,i)=>{const p=left[i];front(p[0])[p[1]]=it});
 SFX.whoosh();renderBoard();items.forEach(it=>flip(it.id,rects[it.id],320));later(settle,360);return true}
function magnet(){const cnt={};G.sh.forEach((sh,s)=>{if(lockedS(s))return;sh.layers[0].forEach(it=>{if(it&&!iced(it))cnt[it.t]=(cnt[it.t]||0)+1})});
 let best=-1,bc=-1;for(const t in cnt)if(cnt[t]>bc){bc=cnt[t];best=+t}
 if(best<0){G.sh.forEach(sh=>sh.layers.forEach(l=>l.forEach(it=>{if(it&&best<0)best=it.t})))}
 if(best<0)return false;
 const cand=[];G.sh.forEach((sh,s)=>sh.layers.forEach((l,li)=>l.forEach((it,k)=>{if(it&&it.t===best)cand.push({it,s,li,k,sc:li*10+(lockedS(s)?5:0)+(iced(it)?3:0)})})));
 cand.sort((a,b)=>a.sc-b.sc);const pick=cand.slice(0,3);if(pick.length<3)return false;
 SFX.whoosh();clearItems(pick.map(p=>({it:p.it,s:p.s})),pick[0].s);
 pick.forEach(p=>{G.sh[p.s].layers[p.li][p.k]=null});
 G.sh.forEach(sh=>{sh.layers=sh.layers.filter((l,li)=>li===0||l.some(Boolean))});
 normalize();renderBoard();updHud();later(settle,300);return true}

 const el=e.target.closest('.it');
 if(el&&el.classList.contains('mov')){drag={el,s:+el.dataset.s,k:+el.dataset.k,id:+el.dataset.id,x0:e.clientX,y0:e.clientY,pid:e.pointerId,moved:false};try{board.setPointerCapture(e.pointerId)}catch(_){}return}
 if(el&&!el.classList.contains('mov')){const s=+el.dataset.s;if(lockedS(s))lockShake(s);else{el.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}],{duration:240});SFX.bad()}return}
 const hit=slotAt(e.clientX,e.clientY);
 if(sel&&hit){const r=elOf(sel.id)&&elOf(sel.id).getBoundingClientRect();tryMove(sel.s,sel.k,hit.s,hit.k,r);if(sel){sel=null;renderBoard()}}
 else if(hit&&lockedS(hit.s))lockShake(hit.s)});
board.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.moved=true;sel=null;board.querySelectorAll('.it.sel').forEach(x=>x.classList.remove('sel'));
  ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=drag.el.textContent;ghost.style.fontSize=(LAY.sl*.7)+'px';document.body.appendChild(ghost);drag.el.classList.add('lift');SFX.pick();hideHand()}
 if(drag.moved){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const h=slotAt(e.clientX,e.clientY);
  board.querySelectorAll('.shelf.hot').forEach(x=>x.classList.remove('hot'));if(h&&h.s!==drag.s&&!lockedS(h.s)){const x=board.querySelector(`.shelf[data-s="${h.s}"]`);if(x)x.classList.add('hot')}}});
function endDrag(e,cancel){if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;board.querySelectorAll('.shelf.hot').forEach(x=>x.classList.remove('hot'));
 if(!d.moved){// dokunma: seç / seçimi kaldır / seçiliyi buraya taşı
  if(sel&&sel.id===d.id){sel=null;renderBoard();return}
  if(sel&&sel.s!==d.s&&emptySlot(d.s)>=0){const r=elOf(sel.id)&&elOf(sel.id).getBoundingClientRect();tryMove(sel.s,sel.k,d.s,null,r);return}
  sel={s:d.s,k:d.k,id:d.id};SFX.pick();renderBoard();return}
 const gr=ghost?ghost.getBoundingClientRect():null;if(ghost){ghost.remove();ghost=null}
 const h=cancel?null:slotAt(e.clientX,e.clientY);
 if(!h||!tryMove(d.s,d.k,h.s,h.k,gr)){d.el.classList.remove('lift');flip(d.id,gr,260)}}
board.addEventListener('pointerup',e=>endDrag(e,false));board.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openPause()});
addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='p')&&state==='play')openPause()});
addEventListener('resize',()=>{resizeFx();if(G&&state!=='menu')renderBoard()});

/* öğretici el */
function showHand(){if(!G||!G.tut||G.moves)return;hideHand();const a=elOf(G.sh[0].layers[0][2]&&G.sh[0].layers[0][2].id),bs=board.querySelector('.shelf[data-s="1"] .slot[data-k="1"]');if(!a||!bs)return;
 const r1=a.getBoundingClientRect(),r2=bs.getBoundingClientRect();handEl=document.createElement('div');handEl.className='hand';handEl.textContent='👆';document.body.appendChild(handEl);
 const x1=r1.left+r1.width/2-14,y1=r1.top+r1.height*.55,x2=r2.left+r2.width/2-14,y2=r2.top+r2.height*.55;
 handEl.animate([{transform:`translate(${x1}px,${y1}px)`,opacity:0},{transform:`translate(${x1}px,${y1}px)`,opacity:1,offset:.15},{transform:`translate(${x2}px,${y2}px)`,opacity:1,offset:.75},{transform:`translate(${x2}px,${y2}px)`,opacity:0}],{duration:1700,iterations:Infinity,easing:'ease-in-out'});
 handEl.style.left='0';handEl.style.top='0'}

/* ================= bitiş ================= */
function starsFor(){const f=G.time/G.tmax;return f>=.45?3:f>=.2?2:1}
function win(){state='wait';hideHand();tip('');SFX.win();vib([30,40,80]);
 for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.25+Math.random()*.3),MARKETS[G.mi].fx,40,380),i*160);
 const st=starsFor();let bonus;
 if(G.daily){bonus=60;const dk=dayKey(),yk=dayKey(-1);S.daily.streak=S.daily.last===yk?(S.daily.streak||0)+1:1;S.daily.last=dk}
 else{const L=G.L,first=!S.stars[L];bonus=(first?20:0)+st*5;S.stars[L]=Math.max(S.stars[L]||0,st);if(L>=S.max&&L<MAXL)S.max=L+1}
 S.coins+=bonus;G.coins+=bonus;save();setTimeout(()=>winSheet(st),700)}
function outOfTime(){state='wait';hideHand();SFX.lose();vib(40);
 if(!G.cont&&window.AdKit&&window.AdKit.available()){G.cont=true;
  window.AdKit.offer({title:T.contTitle,text:T.contText,reward:T.contReward,button:T.contBtn,decline:T.contNo,timeout:8,placement:'continue'}).then(ok=>{if(!G)return;
   if(ok){G.time+=40;G.tmax=Math.max(G.tmax,G.time);state='play';updTimer();toastMsg(T.contReward)}else failSheet(T.timeUp)})}
 else failSheet(T.timeUp)}
function noMoves(){state='wait';
 sheet(`<div class="big-ic">🧺</div><p class="mt">${T.noMoves}</p><p class="ms">${T.noMovesSub}</p>
 <div class="mb"><button class="btn gold" id="nmS">🔀 ${T.b.shuffle} (${S.bst.shuffle||0})</button><button class="btn gold" id="nmH">🧲 ${T.b.hint} (${S.bst.hint||0})</button></div>
 <div class="mb"><button class="btn" id="nmMenu">${T.menu}</button><button class="btn" id="nmRetry">${T.retry}</button></div>`);
 const use=k=>{closeSheet();state='play';useBooster(k)};
 $('#nmS').onclick=()=>use('shuffle');$('#nmH').onclick=()=>use('hint');
 $('#nmMenu').onclick=()=>{closeSheet();toMenu()};$('#nmRetry').onclick=()=>retry()}
function retry(){closeSheet();if(!G)return;if(G.daily)startLevel(0,{daily:true});else startLevel(G.L,{skipIntro:true})}

/* ================= pencereler ================= */
function sheet(h){$('#sheet').innerHTML=h;$('#modal').hidden=false}
function closeSheet(){$('#modal').hidden=true;$('#sheet').innerHTML=''}
let toastT=0;function toastMsg(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1700)}
const starStr=n=>[0,1,2].map(i=>i<n?'<span>★</span>':'<span><em>★</em></span>').join('');
function stageIntro(L){const st=stageOf(L),m=MARKETS[st];state='wait';setMarket(st);
 sheet(`<div class="big-ic">${m.icon}</div><p class="ms" style="margin:0;text-transform:uppercase;letter-spacing:.1em;font-weight:900">${T.stageT} ${st+1} · ${m.city}</p>
 <p class="mt">${T.stages[st]}</p><p class="ms" style="margin:0;color:var(--ink);font-size:15px">${T.stageNew[st]}</p><button class="play" id="goBtn">${T.go}</button>`);
 $('#goBtn').onclick=()=>{S.seen['st'+st]=1;save();closeSheet();startLevel(L,{skipIntro:true})}}
function winSheet(st){const L=G.L,daily=G.daily,last=!daily&&L>=MAXL,stageEnd=!daily&&L%20===0;
 const title=daily?T.daily:last?T.allDone:stageEnd?T.stageDone:T.lvl+' '+L,sub=daily?`🔥 ${S.daily.streak} ${T.streak}`:last?T.allDoneSub:stageEnd?T.stages[stageOf(L)]:T.winSub;
 sheet(`<p class="mt" style="color:var(--green)">${title}</p><p class="ms">${sub}</p><div class="bigstars">${starStr(st)}</div>
 <div class="stats"><div class="stat"><b>${Math.ceil(G.time)} s</b><span>${T.time}</span></div><div class="stat"><b>+${G.coins}</b><span>${T.earned}</span></div></div>
 <div class="mb"><button class="btn" id="wMenu">${T.menu}</button><button class="play" id="wNext">${daily?T.menu:last?T.again:T.next}</button></div>`);
 const after=fn=>{closeSheet();if(window.AdKit){window.AdKit.levelDone({title:T.bonusTitle,reward:T.bonusReward}).then(ok=>{if(ok){S.coins+=30;save();SFX.coin();toastMsg(T.bonusReward)}fn()})}else fn()};
 $('#wMenu').onclick=()=>after(toMenu);$('#wNext').onclick=()=>after(daily?toMenu:()=>startLevel(last?1:L+1))}
function failSheet(title){state='wait';
 sheet(`<div class="big-ic">⏰</div><p class="mt" style="color:var(--pink)">${title}</p><p class="ms">${G.daily?T.daily:T.lvl+' '+G.L} · ${T.left} ${G.left}</p>
 <div class="mb"><button class="btn" id="fMenu">${T.menu}</button><button class="play" id="fRetry">${T.retry}</button></div>`);
 const brk=fn=>{closeSheet();(window.AdKit&&window.AdKit.breakpoint?window.AdKit.breakpoint():Promise.resolve()).then(fn,fn)};
 $('#fMenu').onclick=()=>brk(toMenu);$('#fRetry').onclick=()=>brk(retry)}
function openPause(){if(state!=='play'||!G||!$('#modal').hidden)return;state='paused';drag=null;if(ghost){ghost.remove();ghost=null}
 sheet(`<p class="mt">${T.pause}</p><p class="ms">${G.daily?T.daily:T.lvl+' '+G.L} · ${T.left} ${G.left}</p><div class="mb"><button class="btn" id="pMenu">${T.menu}</button><button class="play" id="pGo">${T.resume}</button></div>`);
 $('#pGo').onclick=()=>{closeSheet();state='play';renderBoard()};$('#pMenu').onclick=()=>{closeSheet();toMenu()}}
$('#pauseBtn').onclick=openPause;

/* ================= menü ================= */
function toMenu(){state='menu';G=null;sel=null;hideHand();tip('');['#hud','#board','#boosters'].forEach(s=>$(s).hidden=true);$('#board').innerHTML='';$('#menu').hidden=false;renderMenu()}
function renderMenu(){T=TXT[S.lang]||TXT.en;document.documentElement.lang=S.lang;
 const cur=Math.min(S.max,MAXL),cst=stageOf(cur);setMarket(cst);
 const cols=['#d8343f','#ffc83d','#2fa36b','#2a6fd6','#ff8a1f','#ff4f8b'];
 $('#logo').innerHTML=[...'Piazza'].map((ch,i)=>`<span style="color:${cols[i%cols.length]}">${ch}</span>`).join('');
 $('#playTxt').textContent=T.play;$('#playSub').textContent=MARKETS[cst].city.toUpperCase()+' · '+T.lvl+' '+cur;$('#tagTxt').textContent=T.tag;
 $('#coinTxt').textContent=S.coins;$('#langBtn').textContent=S.lang.toUpperCase();$('#sndBtn').textContent=S.snd?'🔊':'🔇';$('#sndBtn').setAttribute('aria-label',T.sound);
 const done=S.daily.last===dayKey(),alive=S.daily.last===dayKey()||S.daily.last===dayKey(-1);
 $('#dailyT').textContent=T.daily;$('#dailyS').textContent=done?T.dailyDone:T.dailySub;$('#dailyE').textContent=done?'✓':'+60 🪙';$('#dailyBtn').disabled=done;$('#dailyBtn').style.opacity=done?.7:1;
 if(alive&&S.daily.streak)$('#dailyS').textContent+=` · 🔥 ${S.daily.streak}`;
 const al=Math.max(0,AD_BST_CAP-adDay().b);
 $('#bchips').innerHTML=BST.map(b=>`<button class="bchip" data-mb="${b.k}"><i>${b.ic}</i>${T.b[b.k]} · ${S.bst[b.k]||0}</button>`).join('');
 const gToday=S.gift!==new Date().toDateString();$('#giftBtn').hidden=!gToday;$('#giftBtn').textContent=T.gift;
 $('#howBox').innerHTML=T.how.map(h=>`<div class="ln"><i>${h[0]}</i><div>${h[1]}</div></div>`).join('');
 $('#tourTitle').textContent=T.tour;$('#footTxt').textContent=T.foot;
 if(openStage===null)openStage=cst;
 let sum=0,h='';
 MARKETS.forEach((m,si)=>{const from=si*20+1,locked=from>S.max;let ss=0,lv='';
  for(let i=from;i<from+20;i++){const s=S.stars[i]||0;ss+=s;const lock=i>S.max,ii=(i-1)%20+1,boss=ii===10||ii===20;
   lv+=`<button class="${['lv',s?'done':'',i===cur?'cur':'',lock?'lock':'',boss?'boss':''].join(' ')}" data-l="${i}" aria-label="${T.lvl} ${i}">${i}<span class="st">${lock?'':[0,1,2].map(k=>k<s?'★':'<em>★</em>').join('')}</span></button>`}
  sum+=ss;const open=openStage===si&&!locked;
  h+=`<div class="stage ${locked?'locked':''}"><button class="stage-head" data-s="${si}" aria-expanded="${open}"><span class="stage-ic" style="background:${m.sky[0]};--sa:${m.a};--sb:${m.b}">${m.icon}</span>
   <span><span class="stage-name">${T.stages[si]}</span><span class="stage-place">${T.stageT} ${si+1} · ${m.city}</span><span class="stage-prog"><i style="width:${ss/60*100}%"></i></span></span>
   <span class="stage-stars">${locked?'🔒':ss+' ★'}<small>${locked?'':'/ 60'}</small></span></button>${open?`<div class="stage-new">${T.stageNew[si]}</div><div class="grid">${lv}</div>`:''}</div>`});
 $('#stages').innerHTML=h;$('#starSum').textContent=sum+' / '+MAXL*3+' ★'}
$('#stages').addEventListener('click',e=>{const hd=e.target.closest('.stage-head');if(hd){const si=+hd.dataset.s;if(si*20+1>S.max){toastMsg(T.lockedLv+' '+(si*20));return}openStage=openStage===si?-1:si;renderMenu();return}
 const b=e.target.closest('.lv');if(!b)return;const L=+b.dataset.l;if(L>S.max){toastMsg(T.lockedLv+' '+(L-1));return}startLevel(L)});
$('#bchips').addEventListener('click',e=>{const b=e.target.closest('.bchip');if(b)buySheet(b.dataset.mb)});
$('#playBtn').onclick=()=>startLevel(Math.min(S.max,MAXL));
$('#dailyBtn').onclick=()=>{if(S.daily.last!==dayKey())startLevel(0,{daily:true})};
$('#sndBtn').onclick=()=>{S.snd=!S.snd;save();renderMenu();if(S.snd)beep(660,.1,'triangle',.1)};
$('#langBtn').onclick=()=>{S.lang=LANGS[(LANGS.indexOf(S.lang)+1)%LANGS.length];save();renderMenu()};
$('#giftBtn').onclick=()=>{S.gift=new Date().toDateString();S.coins+=25;save();SFX.coin();toastMsg(T.giftGot);renderMenu()};

/* ================= efekt katmanı ================= */
const fx=$('#fx'),fc=fx.getContext('2d');let FDPR=1,parts=[],rings=[];
function resizeFx(){FDPR=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*FDPR;fx.height=innerHeight*FDPR}
function burst(x,y,cols,n,sp){for(let i=0;i<n&&parts.length<500;i++){const a=Math.random()*TAU,v=(.25+Math.random()*.75)*sp;
 parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.35,t:0,life:.7+Math.random()*.7,s:3+Math.random()*5,c:cols[i%cols.length],r:Math.random()*TAU,star:Math.random()<.3})}}
function ring(x,y){rings.push({x,y,t:0})}
function popText(text,x,y,size,col){const d=document.createElement('div');d.className='pop';d.textContent=text;d.style.cssText+=`left:${x}px;top:${y}px;font-size:${size}px;color:${col}`;document.body.appendChild(d);
 d.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15)',opacity:1,offset:.2},{transform:'translate(-50%,-90%) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-140%) scale(.9)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>d.remove()}
function drawFx(dt){fc.setTransform(FDPR,0,0,FDPR,0,0);fc.clearRect(0,0,innerWidth,innerHeight);
 for(const r of rings){r.t+=dt;const a=1-r.t/.4;if(a<=0)continue;fc.strokeStyle=`rgba(255,255,255,${a})`;fc.lineWidth=4*a+1;fc.beginPath();fc.arc(r.x,r.y,10+r.t*180,0,TAU);fc.stroke()}rings=rings.filter(r=>r.t<.4);
 for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.vx*=.985;p.r+=dt*7}parts=parts.filter(p=>p.t<p.life&&p.y<innerHeight+20);
 for(const p of parts){fc.globalAlpha=Math.max(0,1-p.t/p.life);fc.fillStyle=p.c;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);
  if(p.star){fc.beginPath();for(let i=0;i<10;i++){const rr=i%2?p.s*.45:p.s;fc.lineTo(Math.cos(i*Math.PI/5)*rr,Math.sin(i*Math.PI/5)*rr)}fc.closePath();fc.fill()}else fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()}fc.globalAlpha=1}

/* ================= döngü ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'&&G&&$('#modal').hidden){G.clock+=dt;
  if(G.freeze>0){G.freeze=Math.max(0,G.freeze-dt)}else G.time-=dt;
  const sec=Math.ceil(G.time);if(G.time<=10&&sec!==lastTick&&G.freeze<=0){lastTick=sec;SFX.tick()}
  updTimer();if(G.time<=0){G.time=0;updTimer();outOfTime()}}
 drawFx(dt);requestAnimationFrame(loop)}
resizeFx();
if(location.hash==='#test')window.__T={get G(){return G},get S(){return S},startLevel,tryMove,settle,useBooster,toMenu,hasMove,front,movable,get state(){return state},get busy(){return isBusy()}};
renderMenu();requestAnimationFrame(loop);
})();
